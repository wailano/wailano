<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 한영 단어 공부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --background: #0a0a0c;
            --foreground: #ffffff;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0c 100%);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header {
            margin-bottom: 1rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #6366f1, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
            justify-content: center;
            width: 100%;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        #study-section,
        #calendar-section,
        #manage-section {
            display: none;
        }

        #study-section.active,
        #calendar-section.active,
        #manage-section.active {
            display: block;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4.3;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .card-front {
            background: rgba(255, 255, 255, 0.03);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
        }

        .word-text {
            font-size: clamp(1.8rem, 6vw, 2.3rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: var(--accent);
        }

        .meaning-text {
            font-size: 2.2rem;
            font-weight: 700;
            color: #fff;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 5px;
            background: #111;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        #word-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .image-loading-spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-refresh-img {
            margin-top: 10px;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid var(--primary);
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-ai-auto {
            background: linear-gradient(135deg, #FF3D77, #FF7F50);
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(255, 61, 119, 0.3);
        }

        .btn-ocr {
            background: rgba(34, 211, 238, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 1rem;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 1.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .calendar-day.completed {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            font-weight: 800;
        }

        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
    </style>
</head>

<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="image-loading-spinner" style="width:50px; height:50px; margin-bottom:1rem;"></div>
        <p id="loading-text">인공지능 분석 중...</p>
    </div>

    <main>
        <div class="header">
            <h1 onclick="location.reload()" style="cursor:pointer">AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-study" class="tab active" onclick="showSection('study')">학습</div>
            <div id="tab-calendar" class="tab" onclick="showSection('calendar')">기록</div>
            <div id="tab-manage" class="tab" onclick="showSection('manage')">단어 관리</div>
        </div>

        <!-- STUDY Section -->
        <div id="study-section" class="active">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem;">
                <span id="day-badge"
                    style="background: var(--primary); padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: 700;">Day
                    01</span>
                <span id="progress-text" style="opacity: 0.5; font-size: 0.8rem;">1 / 0</span>
            </div>

            <div class="card-container" id="card">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="word-en" class="word-text">...</div>
                        <div class="image-box" id="img-container">
                            <div class="image-loading-spinner" id="img-spinner"></div>
                            <img id="word-img" src="" alt="">
                        </div>
                        <button class="btn-refresh-img" onclick="refreshImage(event)">🎨 다른 사진으로 다시 시도</button>
                        <p style="margin-top: 10px; opacity: 0.4; font-size: 0.65rem;">터치해서 뜻 확인</p>
                    </div>
                    <div class="card-back">
                        <div id="word-ko" class="meaning-text">...</div>
                        <button class="btn-primary" style="margin-top: 2rem;" onclick="nextWord(event)">다음 단어</button>
                    </div>
                </div>
            </div>

            <div class="stats-grid" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div class="glass-card">
                    <div class="stat-label">오늘</div>
                    <div id="daily-count" class="stat-value">0</div>
                </div>
                <div class="glass-card">
                    <div class="stat-label">누적</div>
                    <div id="total-count" class="stat-value">0</div>
                </div>
            </div>
        </div>

        <!-- CALENDAR Section -->
        <div id="calendar-section">
            <div class="glass-card">
                <h3 id="calendar-month" style="margin-bottom: 1.5rem;"></h3>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>
        </div>

        <!-- MANAGE Section -->
        <div id="manage-section">
            <div class="glass-card">
                <h3 style="margin-bottom: 1.5rem; text-align: left;">🤖 AI 지원실</h3>
                <button class="btn-ai-auto" onclick="recommendAIWord()">✨ 고등 필수 단어 AI 추천받기</button>
                <button class="btn-ocr" onclick="document.getElementById('ocr-input').click()">📸 영단어 사진 분석 & 자동
                    추가</button>
                <input type="file" id="ocr-input" accept="image/*" style="display:none" onchange="handleOCR(event)">

                <div
                    style="border-top: 1px solid var(--glass-border); padding-top: 1.5rem; margin-top: 1rem; text-align: left;">
                    <label class="stat-label">직접 추가 (영어 입력 시 한글 자동 입력)</label>
                    <input type="text" id="new-en" placeholder="예: Universe" onblur="handleAutoTranslate()">
                    <input type="text" id="new-ko" placeholder="한글 뜻">
                    <button class="btn-primary" style="margin-top:10px" onclick="addWord()">단어장에 추가</button>
                </div>

                <p class="stat-label" id="word-count-label" style="margin-top: 2rem; text-align: left;">내 단어장 목록 (0)</p>
                <div id="word-list" style="text-align: left; max-height: 200px; overflow-y: auto; margin-top: 10px;">
                </div>
            </div>
        </div>
    </main>

        ];

        let words = JSON.parse(localStorage.getItem('voca_list')) || MASTER_WORDS;
        let currentIndex = 0;
        let retryCount = 0;
        let studyHistory = JSON.parse(localStorage.getItem('voca_history') || '{}');
        let dailyCount = parseInt(localStorage.getItem('voca_daily') || '0');
        let totalCount = parseInt(localStorage.getItem('voca_total') || '0');
        const dateKey = new Date().toISOString().split('T')[0];

        function showSection(section) {
            ['study', 'calendar', 'manage'].forEach(s => {
                document.getElementById(`${s}-section`).classList.toggle('active', s === section);
                document.getElementById(`tab-${s}`).classList.toggle('active', s === section);
            });
            if (section === 'calendar') renderCalendar();
            if (section === 'manage') renderWordList();
        }

        async function translateToKorean(text) {
            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
                const data = await response.json();
                return data.responseData.translatedText;
            } catch { return ''; }
        }

        async function handleAutoTranslate() {
            const en = document.getElementById('new-en').value.trim();
            if (!en) return;
            const koInput = document.getElementById('new-ko');
            if (!koInput.value) {
                koInput.placeholder = '번역 중...';
                koInput.value = await translateToKorean(en);
            }
        }

        async function recommendAIWord() {
            document.getElementById('loading-overlay').style.display = 'flex';
            const AI_WORDS = ["phenomenon", "fundamental", "perspective", "hypothesis", "significance", "consequence", "interpretation", "inevitable", "comprehensive", "distinction", "objective", "subjective", "prejudice", "vulnerability", "sustainable", "infrastructure", "adversity", "cognitive", "profound", "ambiguous", "superficial", "adequate", "integrity", "reconcile", "validity", "artificial", "sophisticated", "unprecedented", "manipulate", "paradox", "rehabilitation", "intervention", "compliance", "deficit", "surplus", "equivalent", "empirical", "ethical", "controversial", "implications"];
            const randomEn = AI_WORDS[Math.floor(Math.random() * AI_WORDS.length)];
            const translatedKo = await translateToKorean(randomEn);
            words.unshift({ en: randomEn, ko: translatedKo, day: 'AI' });
            localStorage.setItem('voca_list', JSON.stringify(words));
            setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none'; renderWordList(); alert(`✨ AI 추천 완료: ${randomEn}`); }, 800);
        }

        async function handleOCR(event) {
            const file = event.target.files[0];
            if (!file) return;
            const overlay = document.getElementById('loading-overlay');
            const loadingText = document.getElementById('loading-text');
            overlay.style.display = 'flex';
            loadingText.innerText = 'OCR 이미지 분석 중...';
            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                const stopWords = new Set(['the','and','for','are','but','not','you','all','can','was','one','has','how','its','may','new','now','see','two','who','did','she','too','use','this','that','with','from','they','have','been','will','your','more','when','also','into','than','then','them','these']);
                const found = [...new Set(
                    (text.match(/[a-zA-Z]{3,}/g) || []).map(w => w.toLowerCase())
                )].filter(w => !stopWords.has(w));

                if (!found.length) { alert('영단어를 찾지 못했습니다.'); return; }

                const existing = new Set(words.map(w => w.en.toLowerCase()));
                const toAdd = [];
                for (let i = 0; i < found.length; i++) {
                    loadingText.innerText = `번역 중... (${i + 1} / ${found.length})`;
                    if (existing.has(found[i])) continue;
                    const ko = await translateToKorean(found[i]);
                    if (ko) { toAdd.push({ en: found[i], ko, day: 'User' }); existing.add(found[i]); }
                }

                if (toAdd.length) {
                    words = [...toAdd, ...words];
                    localStorage.setItem('voca_list', JSON.stringify(words));
                    currentIndex = 0;
                    renderWordList();
                    updateUI();
                    alert(`✅ ${toAdd.length}개 단어 추가 완료! (${found.length - toAdd.length}개 중복 제외)`);
                } else {
                    alert('새로 추가할 단어가 없습니다 (모두 중복).');
                }
            } catch(e) {
                alert('오류: ' + e.message);
            } finally {
                overlay.style.display = 'none';
                event.target.value = '';
            }
        }

        function addWord() {
            const en = document.getElementById('new-en').value.trim();
            const ko = document.getElementById('new-ko').value.trim();
            if (!en || !ko) return alert('내용을 입력해주세요!');
            words.unshift({ en, ko, day: 'User' });
            localStorage.setItem('voca_list', JSON.stringify(words));
            renderWordList();
            document.getElementById('new-en').value = '';
            document.getElementById('new-ko').value = '';
        }

        function renderWordList() {
            document.getElementById('word-count-label').innerText = `내 단어장 목록 (${words.length})`;
            document.getElementById('word-list').innerHTML = words.map((w, i) => `
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;">
                    <span>[D${w.day || '-'}] <b>${w.en}</b>: ${w.ko}</span>
                    <span style="color: #ff5555; cursor: pointer;" onclick="deleteWord(${i})">삭제</span>
                </div>
            `).join('');
        }

        function deleteWord(i) {
            words.splice(i, 1);
            localStorage.setItem('voca_list', JSON.stringify(words));
            renderWordList();
        }

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            document.getElementById('calendar-month').innerText = `${year}년 ${month + 1}월`;
            const grid = document.getElementById('calendar-days');
            grid.innerHTML = '';
            ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
                const el = document.createElement('div'); el.innerText = d; el.style.opacity = '0.4'; el.style.fontSize = '0.7rem'; grid.appendChild(el);
            });
            const firstDay = new Date(year, month, 1).getDay();
            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
            const daysCount = new Date(year, month + 1, 0).getDate();
            for (let i = 1; i <= daysCount; i++) {
                const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day' + (studyHistory[dKey] ? ' completed' : '');
                dayEl.innerText = i;
                grid.appendChild(dayEl);
            }
        }

        function loadBestImage(keyword) {
            const img = document.getElementById('word-img');
            const spinner = document.getElementById('img-spinner');
            img.style.display = 'none'; spinner.style.display = 'block';

            const cleanWord = keyword.replace(/[^a-zA-Z ]/g, "").trim();
            const timestamp = new Date().getTime();

            // 3중 안전 소스 (순서대로 시도)
            const sources = [
                `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanWord + ' high-quality object visual')}?width=400&height=400&nologo=true&seed=${timestamp}`,
                `https://loremflickr.com/400/400/${encodeURIComponent(cleanWord)}?lock=${timestamp % 1000}`,
                `https://ui-avatars.com/api/?name=${keyword[0]}&size=400&background=6366f1&color=fff&font-size=0.5`
            ];

            function tryLoad(index) {
                if (index >= sources.length) {
                    spinner.style.display = 'none';
                    return;
                }
                const tempImg = new Image();
                tempImg.src = sources[index];

                tempImg.onload = () => {
                    img.src = sources[index];
                    img.style.display = 'block';
                    spinner.style.display = 'none';
                };

                tempImg.onerror = () => {
                    tryLoad(index + 1);
                };

                // AI 서버가 너무 오래 걸릴 경우(5초) 다음 서버로 강제 전환
                setTimeout(() => {
                    if (img.style.display === 'none' && index === 0) {
                        tryLoad(index + 1);
                    }
                }, 5000);
            }

            tryLoad(0);
        }

        function refreshImage(e) {
            if (e) e.stopPropagation();
            const word = words[currentIndex % words.length];
            loadBestImage(word.en);
        }

        function updateUI() {
            if (words.length === 0) return;
            const word = words[currentIndex % words.length];
            document.getElementById('word-en').innerText = word.en;
            document.getElementById('word-ko').innerText = word.ko;
            document.getElementById('day-badge').innerText = `Day ${String(word.day || 'User').padStart(2, '0')}`;

            loadBestImage(word.en);

            document.getElementById('daily-count').innerText = dailyCount;
            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('progress-text').innerText = `${(currentIndex % words.length) + 1} / ${words.length}`;

            if ((currentIndex % words.length) === words.length - 1 && !studyHistory[dateKey]) {
                studyHistory[dateKey] = true;
                localStorage.setItem('voca_history', JSON.stringify(studyHistory));
                setTimeout(() => alert('🎉 오늘의 모든 단어를 학습했습니다!'), 800);
            }
        }

        function nextWord(e) {
            e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { currentIndex++; dailyCount++; totalCount++; localStorage.setItem('voca_daily', dailyCount); localStorage.setItem('voca_total', totalCount); updateUI(); }, 300);
        }

        document.getElementById('card').addEventListener('click', () => { if (words.length) document.getElementById('card').classList.toggle('flipped'); });

        if (localStorage.getItem('voca_date') !== new Date().toDateString()) {
            dailyCount = 0; localStorage.setItem('voca_daily', '0');
            localStorage.setItem('voca_date', new Date().toDateString());
        }
        updateUI();
    </script>
