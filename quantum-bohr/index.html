<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 정답 자동 로딩 버전</title>
    <script src="vocabulary.js" onerror="window.MASTER_WORDS=[]"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d0d12;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0d0d12 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            opacity: 0.6;
            font-weight: 700;
        }

        .tab.active {
            background: var(--primary);
            opacity: 1;
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/5;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.8rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
        }

        .word-text {
            font-size: clamp(2rem, 8vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #fff;
            text-align: center;
        }

        .meaning-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
            line-height: 1.2;
        }

        .explanation-box {
            width: 100%;
            flex-grow: 1;
            padding: 1.2rem;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            overflow-y: auto;
        }

        .ex-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #f1f3f5;
            word-break: keep-all;
        }

        .ex-tag {
            position: absolute;
            top: -10px;
            left: 20px;
            background: #FFD93D;
            color: #000;
            font-size: 0.65rem;
            padding: 3px 10px;
            border-radius: 8px;
            font-weight: 800;
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.1rem;
            border-radius: 20px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1rem;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        .manage-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 1.5rem;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 1rem;
            border-radius: 15px;
            background: #1a1a2e;
            border: 1px solid var(--primary);
            color: white;
            margin-bottom: 12px;
            font-size: 1rem;
            font-weight: 700;
        }

        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">관리</div>
        </div>

        <div id="learn-view">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.6rem; padding: 0 5px;">
                <span id="day-info" style="color: var(--accent); font-weight: 800; font-size: 0.8rem;">Quiz Mode</span>
                <span id="prog-info" style="opacity: 0.6; font-size: 0.8rem;">0 / 0</span>
            </div>

            <div class="card-container" id="card" onclick="document.getElementById('card').classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">...</div>
                        <div class="explanation-box">
                            <span class="ex-tag">🔎 힌트 퀴즈</span>
                            <div class="loading-wrap" id="ex-loader">
                                <div class="spinner"></div>
                                <div style="font-size:0.75rem; color:var(--accent);">AI가 정보를 찾는 중...</div>
                            </div>
                            <div id="w-ex" class="ex-text" style="display:none"></div>
                        </div>
                        <p style="margin-top: 1.2rem; opacity: 0.4; font-size: 0.65rem;">카드를 뒤집으면 정답 공개!</p>
                    </div>
                    <div class="card-back">
                        <!-- 정답이 표시되는 곳 -->
                        <div id="w-ko" class="meaning-text">...</div>
                        <p style="font-size:0.8rem; opacity:0.5; margin-top:10px;">(한국어 뜻)</p>
                        <button class="btn-main" style="margin-top: 2.5rem;" onclick="goNext(event)">다음 단어 ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="manage-view">
            <div class="manage-card">
                <p style="font-size: 0.9rem; margin-bottom: 12px; color: var(--accent); font-weight: 800;">🚀 AI 단어 대량
                    생성</p>
                <select id="sel-level">
                    <option value="preschool basic">👶 어린이 기초</option>
                    <option value="elementary essential">🎒 초등 필수</option>
                    <option value="middle school SAT">🏫 중등 내신</option>
                    <option value="high school academic">🎓 고등/수능 고난도</option>
                </select>
                <button id="btn-batch" class="btn-main" onclick="askAIBatch()">✨ AI 단어 50개 누적 추가</button>
                <div
                    style="display:flex; justify-content: space-between; margin-top:2rem; font-size:0.8rem; opacity:0.6;">
                    <span id="list-cnt">현재 총 단어 수 확인 중...</span>
                    <span style="color:#ff4d4d; cursor:pointer;" onclick="clearAll()">초기화</span>
                </div>
                <div id="list-box"
                    style="width: 100%; margin-top: 0.8rem; max-height: 200px; overflow-y: auto; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px;">
                </div>
            </div>
        </div>
    </main>

    <script>
        let words = [];
        const FALLBACK = [{ en: 'book', ko: '책', day: '기본', ex: '우리가 읽는 것이에요. 예문: I read a ____.' }];

        function init() {
            const saved = localStorage.getItem('voca_list');
            if (saved) {
                try { words = JSON.parse(saved); } catch (e) { words = FALLBACK; }
            } else if (typeof MASTER_WORDS !== 'undefined' && MASTER_WORDS.length > 0) {
                words = MASTER_WORDS;
            } else { words = FALLBACK; }
            if (!words.length) words = FALLBACK;
            localStorage.setItem('voca_list', JSON.stringify(words));
            updateInfo();
        }

        init();
        let idx = Math.floor(Math.random() * words.length);

        function nav(name) {
            document.getElementById('learn-view').style.display = (name === 'learn') ? 'block' : 'none';
            document.getElementById('manage-view').style.display = (name === 'manage') ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', name === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', name === 'manage');
            if (name === 'manage') drawList();
        }

        async function loadCardData(wordEn) {
            const current = words[idx % words.length];
            const exEl = document.getElementById('w-ex');
            const koEl = document.getElementById('w-ko');
            const loader = document.getElementById('ex-loader');

            exEl.style.display = 'none';
            loader.style.display = 'flex';
            koEl.innerText = "찾는 중..."; // 뒤집었을 때 대비

            // 1. 뜻(정답)이 없거나 기본 텍스트면 실시간 번역
            if (!current.ko || current.ko.includes('클릭') || current.ko.includes('뒤에')) {
                try {
                    const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(wordEn)}&langpair=en|ko`);
                    const d = await r.json();
                    current.ko = d.responseData.translatedText;
                    localStorage.setItem('voca_list', JSON.stringify(words));
                } catch (e) { current.ko = "뜻 찾기 실패"; }
            }
            koEl.innerText = current.ko;

            // 2. 힌트 가져오기
            if (current.ex && !current.ex.includes('count')) {
                showHint(current.ex);
            } else {
                try {
                    const prompt = `Give a simple riddle in Korean for "${wordEn}". NO SPOILERS (don't use the word or its meaning). Add English example with "____". respond ONLY with riddle and example.`;
                    const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                    let text = await res.text();
                    text = text.replace(new RegExp(wordEn, 'gi'), "____");
                    current.ex = text;
                    localStorage.setItem('voca_list', JSON.stringify(words));
                    showHint(text);
                } catch (e) { showHint("힌트를 준비하지 못했습니다."); }
            }
        }

        function showHint(text) {
            document.getElementById('w-ex').innerText = text;
            document.getElementById('w-ex').style.display = 'block';
            document.getElementById('ex-loader').style.display = 'none';
        }

        function refresh() {
            if (!words.length) return;
            const w = words[idx % words.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('prog-info').innerText = `${(idx % words.length) + 1} / ${words.length}`;
            document.getElementById('day-info').innerText = `${w.day || 'AI'} Level`;
            loadCardData(w.en);
        }

        function goNext(e) {
            if (e) e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                idx = Math.floor(Math.random() * words.length);
                refresh();
            }, 300);
        }

        async function askAIBatch() {
            const btn = document.getElementById('btn-batch');
            btn.innerText = "⏳ 50개 수집 중..."; btn.disabled = true;
            try {
                const level = document.getElementById('sel-level').value;
                const prompt = `Give 50 English words for ${level}. Return ONLY a JSON array of strings: ["word1", "word2", ...]. No other text.`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const out = await res.text();
                const list = JSON.parse(out.replace(/```json|```/g, "").trim());

                if (Array.isArray(list)) {
                    const news = list.map(en => ({ en, ko: '번역 대기 중', day: level.split(" ")[0].toUpperCase() }));
                    words = [...news, ...words];
                    localStorage.setItem('voca_list', JSON.stringify(words));
                    drawList(); updateInfo(); alert('50개가 추가되었습니다! 학습 탭을 눌러보세요.');
                    refresh();
                }
            } catch (e) { alert('AI 지연! 다시 눌러주세요.'); }
            finally { btn.innerText = "✨ AI 단어 50개 누적 추가"; btn.disabled = false; }
        }

        function drawList() {
            const b = document.getElementById('list-box');
            if (b) b.innerHTML = words.slice(0, 100).map(w => `<div style="padding:8px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.85rem;"><b>${w.en}</b></div>`).join('');
        }

        function updateInfo() {
            const info = document.getElementById('list-cnt');
            if (info) info.innerText = `현재 총 ${words.length}개의 단어 보유 중`;
        }

        function clearAll() {
            if (confirm('모든 단어를 리셋할까요?')) {
                localStorage.removeItem('voca_list');
                location.reload();
            }
        }

        window.onload = refresh;
    </script>
</body>

</html>
