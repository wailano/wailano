<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | Compact Edition</title>
    <script src="vocabulary.js" onerror="window.MASTER_WORDS=[]"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #09090b;
            --primary: #4285f4;
            --accent: #10b981;
            --card-bg: rgba(255, 255, 255, 0.03);
            --danger: #ef4444;
            --gemini-grad: linear-gradient(135deg, #4285f4, #91b9ff, #c084fc);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(66, 133, 244, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.1) 0%, transparent 50%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0.8rem;
        }

        main {
            width: 100%;
            max-width: 420px;
            position: relative;
            min-height: calc(100vh - 1.6rem);
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            font-size: 1.6rem;
            text-align: center;
            margin-bottom: 0.6rem;
            font-weight: 800;
            background: var(--gemini-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(66, 133, 244, 0.3));
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 18px;
            cursor: pointer;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0.4;
            font-weight: 700;
            transition: 0.2s;
        }

        .tab.active {
            background: rgba(66, 133, 244, 0.15);
            opacity: 1;
            color: white;
            border-color: rgba(66, 133, 244, 0.5);
        }

        .card-container {
            perspective: 2000px;
            width: 100%;
            aspect-ratio: 3/5.3;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1.4rem;
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.12), rgba(192, 132, 252, 0.08));
            justify-content: center;
        }

        .word-text {
            font-size: clamp(2rem, 9vw, 3.2rem);
            font-weight: 800;
            margin-bottom: 1rem;
            text-align: center;
            color: #fff;
            letter-spacing: -1.5px;
        }

        .meaning-text {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
        }

        /* � 박스 높이 압축 (180px) */
        .visual-box,
        .explanation-box {
            width: 100%;
            height: 180px;
            border-radius: 25px;
            margin-bottom: 1rem;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .visual-box {
            overflow: hidden;
        }

        .visual-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.5s ease;
            filter: blur(25px);
            opacity: 0.3;
        }

        .visual-box img.revealed {
            filter: blur(0);
            opacity: 1;
        }

        .reveal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: 0.2s;
            border-radius: 25px;
        }

        .reveal-overlay span {
            background: rgba(255, 255, 255, 0.12);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        .explanation-box {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 1.2rem;
        }

        .ex-text {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #e4e4e7;
            font-weight: 600;
            word-break: keep-all;
            filter: blur(15px);
            transition: 0.4s;
        }

        .ex-text.revealed {
            filter: blur(0);
        }

        .ex-tag {
            position: absolute;
            top: -10px;
            left: 18px;
            background: var(--gemini-grad);
            color: #fff;
            font-size: 0.6rem;
            padding: 3px 12px;
            border-radius: 10px;
            font-weight: 800;
            z-index: 10;
        }

        .btn-main {
            background: var(--gemini-grad);
            border: none;
            color: white;
            padding: 1rem;
            border-radius: 22px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            box-shadow: 0 10px 20px -5px rgba(66, 133, 244, 0.4);
        }

        .btn-main:active {
            transform: scale(0.97);
        }

        /* 🎖️ 푸터 밀착 최적화 */
        .footer {
            margin-top: 2rem;
            padding-bottom: 1.5rem;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.2);
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .footer .author {
            color: var(--accent);
            opacity: 0.7;
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        .manage-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 1.8rem;
        }

        .api-input-wrap {
            background: rgba(66, 133, 244, 0.05);
            border-radius: 20px;
            padding: 1rem;
            border: 1px solid rgba(66, 133, 244, 0.15);
            margin-bottom: 1.5rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.8rem;
            border-radius: 12px;
            background: #000;
            border: 1px solid rgba(66, 133, 244, 0.2);
            color: #91b9ff;
            margin-top: 8px;
            font-family: monospace;
            outline: none;
        }

        select {
            width: 100%;
            padding: 0.9rem;
            border-radius: 18px;
            background: #1a1a2e;
            border: 1px solid rgba(66, 133, 244, 0.15);
            color: white;
            margin-bottom: 10px;
            font-weight: 700;
            text-align: center;
        }

        .level-selector {
            display: flex;
            gap: 7px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 8px;
            scrollbar-width: none;
        }

        .lv-btn {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 0.8rem;
            color: #ccc;
            cursor: pointer;
        }

        .lv-btn.active {
            background: #10b981;
            color: #fff;
            font-weight: 800;
            border-color: transparent;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── 테이블 뷰 ── */
        #table-view { width: 100%; }
        .tbl-search-wrap { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 1rem 1.2rem; margin-bottom: 0.8rem; }
        .tbl-search-input { width: 100%; background: #000; border: 1px solid rgba(66,133,244,0.25); border-radius: 12px; padding: 0.7rem 1rem; color: white; font-size: 0.9rem; outline: none; }
        .tbl-search-input:focus { border-color: var(--primary); }
        .tbl-lv-row { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
        .tbl-lv-btn { padding: 5px 12px; border-radius: 10px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08); font-size: 0.75rem; color: #ccc; cursor: pointer; font-weight: 700; }
        .tbl-lv-btn.active { background: var(--primary); color: #fff; border-color: transparent; }
        .tbl-card { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1); border-radius: 25px; overflow: hidden; }
        .tbl-wrap { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
        th { padding: 10px 12px; background: rgba(66,133,244,0.1); cursor: pointer; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); font-weight: 800; color: #91b9ff; white-space: nowrap; user-select: none; }
        th:hover { background: rgba(66,133,244,0.18); }
        td { padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .tbl-lv-tag { font-size: 0.65rem; background: rgba(66,133,244,0.2); border: 1px solid rgba(66,133,244,0.3); border-radius: 6px; padding: 2px 7px; font-weight: 800; color: #91b9ff; white-space: nowrap; }
        .tbl-del-btn { background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.85rem; font-weight: 800; padding: 2px 6px; }
        .tbl-info { text-align: center; font-size: 0.72rem; color: rgba(255,255,255,0.25); margin-top: 0.8rem; font-weight: 700; }
        .sort-ind { margin-left: 3px; font-size: 0.65rem; }
        .ocr-btn { background: rgba(16,185,129,0.1); border: 1px dashed #10b981; color: #10b981; padding: 0.9rem; border-radius: 14px; width: 100%; cursor: pointer; font-weight: 700; font-size: 0.9rem; margin-bottom: 1rem; }
        .ocr-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>Gemini Visual Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습 중</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">AI 설정</div>
            <div id="tab-table" class="tab" onclick="nav('table')">📋 목록</div>
        </div>

        <div id="learn-view">
            <div class="level-selector">
                <div class="lv-btn active" onclick="setFilter('ALL', this)">전체</div>
                <div class="lv-btn" onclick="setFilter('TRAVEL', this)">여행</div>
                <div class="lv-btn" onclick="setFilter('KID', this)">어린이</div>
                <div class="lv-btn" onclick="setFilter('ELEM', this)">초등</div>
                <div class="lv-btn" onclick="setFilter('MID', this)">중등</div>
                <div class="lv-btn" onclick="setFilter('HIGH', this)">고등</div>
            </div>

            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; padding: 0 8px;">
                <span id="model-info" style="color: #91b9ff; font-weight: 800; font-size: 0.8rem;">Mode: ACTIVE</span>
                <span id="prog-info" style="color: rgba(255,255,255,0.25); font-size: 0.75rem; font-weight: 800;">0 /
                    0</span>
            </div>

            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">Loading...</div>

                        <div class="visual-box">
                            <img id="w-img" src="" alt="visual">
                            <div class="reveal-overlay" id="img-reveal" onclick="revealElement('img', event)">
                                <span>🖼️ 사진 보기</span>
                            </div>
                        </div>

                        <div class="explanation-box">
                            <span class="ex-tag">✨ Gemini Quiz</span>
                            <div id="w-ex" class="ex-text">...</div>
                            <div class="reveal-overlay" id="ex-reveal" onclick="revealElement('ex', event)">
                                <span>🔍 힌트 보기</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div id="w-ko" class="meaning-text">...</div>
                        <button class="btn-main" style="margin-top: 2rem;" onclick="goNext(event)">다음 마스터 ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="manage-view">
            <div class="manage-card">
                <div class="api-input-wrap">
                    <p style="font-size: 0.8rem; color: #91b9ff; font-weight: 800; text-align: center;">🔑 Gemini API
                        Key</p>
                    <input type="password" id="gemini-key" placeholder="키 입력" onchange="saveKey()" autocomplete="off">
                    <label style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:0.72rem;color:rgba(255,255,255,0.45);cursor:pointer;">
                        <input type="checkbox" id="persist-key" onchange="saveKey()" style="width:auto;margin:0;accent-color:#4285f4;">
                        이 기기에 저장 (체크 해제 시 탭 닫으면 삭제)
                    </label>
                    <button
                        style="margin-top:8px; background:rgba(255,255,255,0.08); border:none; color:#ddd; padding:8px; border-radius:10px; font-size:0.75rem; width:100%; cursor:pointer;"
                        onclick="fetchMyModels()">🔄 모델 목록 업데이트</button>
                </div>
                <select id="sel-model" onchange="updateModelInfo()">
                    <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                </select>
                <button id="btn-ocr" class="ocr-btn" onclick="document.getElementById('ocr-file').click()">
                    📸 사진 OCR — 영단어 일괄 추출 & 추가
                </button>
                <input type="file" id="ocr-file" accept="image/*" style="display:none" onchange="handleOCR(event)">

                <p
                    style="font-size: 0.9rem; margin-bottom: 10px; color: #10b981; font-weight: 800; text-align: center;">
                    🚀 AI 새 단어 수집</p>
                <select id="sel-level">
                    <option value="TRAVEL">✈️ 여행 필수</option>
                    <option value="KID">👶 어린이</option>
                    <option value="ELEM">🎒 초등학교</option>
                    <option value="MID">🏫 중학교</option>
                    <option value="HIGH" selected>🎓 고등학교</option>
                </select>
                <button id="btn-batch" class="btn-main" style="width: 100%;" onclick="askGeminiBatch(100)">AI 100개 세트 마법
                    생성</button>
                <div
                    style="display:flex; justify-content: space-between; margin-top:2rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1rem;">
                    <span id="list-cnt" style="font-size:0.75rem; color:rgba(255,255,255,0.25);">0 Vocabs</span>
                    <button
                        style="border:none; background:none; color:var(--danger); font-size:0.75rem; font-weight:800; cursor:pointer;"
                        onclick="clearAll()">리셋</button>
                </div>
            </div>
        </div>

        <div id="table-view" style="display:none;">
            <div class="tbl-search-wrap">
                <input type="text" class="tbl-search-input" id="tbl-search" placeholder="🔍 영어 또는 한글로 검색..." oninput="renderTable()">
                <div class="tbl-lv-row">
                    <div class="tbl-lv-btn active" onclick="setTblFilter('ALL',this)">전체</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('KID',this)">어린이</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('ELEM',this)">초등</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('MID',this)">중등</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('HIGH',this)">고등</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('TRAVEL',this)">여행</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('AI',this)">AI</div>
                    <div class="tbl-lv-btn" onclick="setTblFilter('User',this)">직접추가</div>
                </div>
            </div>
            <div class="tbl-card">
                <div class="tbl-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th style="width:36px; cursor:default;">#</th>
                                <th onclick="sortTable('en')">영어 <span class="sort-ind" id="sort-en">▲</span></th>
                                <th onclick="sortTable('ko')">한글 <span class="sort-ind" id="sort-ko"></span></th>
                                <th onclick="sortTable('day')">레벨 <span class="sort-ind" id="sort-day"></span></th>
                                <th style="cursor:default;">힌트</th>
                                <th style="width:36px; cursor:default;"></th>
                            </tr>
                        </thead>
                        <tbody id="tbl-body"></tbody>
                    </table>
                </div>
            </div>
            <p class="tbl-info" id="tbl-info"></p>
        </div>

        <footer class="footer">CREATED BY <span class="author">날아라메뚜기</span></footer>
    </main>

    <script>
        let words = [];
        let currentFilter = 'ALL';
        let idx = 0;

        function init() {
            const saved = localStorage.getItem('voca_list');
            words = saved ? JSON.parse(saved) : (window.MASTER_WORDS || []);
            const key = getApiKey();
            if (key) {
                document.getElementById('gemini-key').value = key;
                document.getElementById('persist-key').checked = !!localStorage.getItem('gemini_api_key');
            }
            const mod = localStorage.getItem('gemini_model');
            if (mod) {
                const sel = document.getElementById('sel-model');
                if (![...sel.options].some(o => o.value === mod)) {
                    const opt = document.createElement('option');
                    opt.value = opt.innerText = mod; sel.appendChild(opt);
                }
                sel.value = mod;
            }
            saveAndRef(); refresh(); updateModelInfo();
        }

        function getApiKey() {
            return localStorage.getItem('gemini_api_key') || sessionStorage.getItem('gemini_api_key') || '';
        }

        function saveKey() {
            const val = document.getElementById('gemini-key').value.trim();
            const persist = document.getElementById('persist-key').checked;
            if (!val) return;
            if (persist) {
                localStorage.setItem('gemini_api_key', val);
                sessionStorage.removeItem('gemini_api_key');
            } else {
                sessionStorage.setItem('gemini_api_key', val);
                localStorage.removeItem('gemini_api_key');
            }
        }

        async function fetchMyModels() {
            const key = getApiKey();
            if (!key) return;
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
                const data = await res.json();
                if (data.models) {
                    const sel = document.getElementById('sel-model');
                    const cur = sel.value; sel.innerHTML = '';
                    data.models.filter(m => m.supportedGenerationMethods.includes('generateContent'))
                        .forEach(m => {
                            const n = m.name.replace('models/', '');
                            const o = document.createElement('option');
                            o.value = o.innerText = n; sel.appendChild(o);
                        });
                    sel.value = cur; if (!sel.value) sel.selectedIndex = 0;
                    updateModelInfo();
                    alert('모델 업데이트 완료!');
                }
            } catch (e) { }
        }

        function updateModelInfo() {
            const name = document.getElementById('sel-model').value;
            localStorage.setItem('gemini_model', name);
            const el = document.getElementById('model-info');
            if (el) el.innerText = `Mode: ${name.toUpperCase().replace('GEMINI-', '')}`;
        }

        function saveAndRef() {
            const uniq = []; const seen = new Set();
            words.forEach(w => {
                if (!w.en) return;
                const k = w.en.toLowerCase().trim();
                if (!seen.has(k)) { seen.add(k); uniq.push(w); }
            });
            words = uniq;
            localStorage.setItem('voca_list', JSON.stringify(words));
            const cntEl = document.getElementById('list-cnt');
            if (cntEl) cntEl.innerText = `${words.length}개 보유 중`;
        }

        async function translateToKorean(text) {
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=en|ko`);
                const data = await res.json();
                return data.responseData?.translatedText || '';
            } catch { return ''; }
        }

        async function askGeminiBatch(count) {
            const key = getApiKey();
            if (!key) { alert('API 키 필요'); return; }
            const modelName = document.getElementById('sel-model').value;
            const level = document.getElementById('sel-level').value;
            const btn = document.getElementById('btn-batch');
            btn.innerText = "⏳ 생성 중..."; btn.disabled = true;
            try {
                const levelLabel = { TRAVEL: 'travel/tourism', KID: 'children (age 5-8)', ELEM: 'elementary school', MID: 'middle school', HIGH: 'high school / SAT' }[level] || level;
                const p = `Generate exactly ${count} unique English vocabulary words appropriate for ${levelLabel} level learners.
Return ONLY a valid JSON array with no extra text. Each object must include all three fields:
- "en": the English word (string)
- "ko": the Korean translation/meaning in Korean characters (string) — THIS FIELD IS REQUIRED FOR EVERY ITEM
- "ex": a short Korean riddle/hint that describes the word without stating it directly (string)
Example: [{"en":"journey","ko":"여행","ex":"집을 떠나 새로운 곳을 향해 나아가는 것"},...]
No duplicates. Return exactly ${count} items.`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: p }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const d = await res.json();

                // API 오류 응답 체크
                if (d.error) throw new Error(`Gemini: ${d.error.message}`);
                if (!d.candidates || d.candidates.length === 0) {
                    const reason = d.promptFeedback?.blockReason || '알 수 없는 오류';
                    throw new Error(`응답이 비어있습니다 (${reason}). API 키·모델·할당량을 확인하세요.`);
                }

                // 마크다운 코드블록으로 감싸진 경우 제거
                let rawText = d.candidates[0].content.parts[0].text;
                rawText = rawText.replace(/^```(?:json)?\s*/m, '').replace(/\s*```$/m, '').trim();
                const list = JSON.parse(rawText);

                // ko 누락된 항목 폴백 번역
                btn.innerText = "⏳ 번역 보완 중...";
                for (const item of list) {
                    if (!item.ko || item.ko.trim() === '') {
                        item.ko = await translateToKorean(item.en);
                    }
                }

                words = [...list.map(i => ({ ...i, day: level })), ...words];
                saveAndRef(); refresh(); alert(`✅ ${list.length}개 단어 생성 완료!`);
            } catch (e) { alert('오류: ' + e.message); }
            finally { btn.innerText = "AI 100개 세트 마법 생성"; btn.disabled = false; }
        }

        async function fetchGeminiVisual(word) {
            const img = document.getElementById('w-img');
            const key = getApiKey();
            const modelName = document.getElementById('sel-model').value;
            img.classList.remove('revealed');
            let p = word;
            if (key) {
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
                        method: 'POST',
                        body: JSON.stringify({ contents: [{ parts: [{ text: `3 keywords for ${word}` }] }] })
                    });
                    const d = await r.json(); p = d.candidates[0].content.parts[0].text.trim();
                } catch (e) { }
            }
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ' cinematic')}?width=600&height=400&nologo=true&seed=${Math.floor(Math.random() * 999)}`;
        }

        function revealElement(type, e) {
            if (e) e.stopPropagation();
            if (type === 'img') {
                document.getElementById('w-img').classList.add('revealed');
                document.getElementById('img-reveal').style.display = 'none';
            } else {
                document.getElementById('w-ex').classList.add('revealed');
                document.getElementById('ex-reveal').style.display = 'none';
            }
        }

        function refresh() {
            const f = (currentFilter === 'ALL') ? words : words.filter(w => w.day === currentFilter);
            if (!f.length) { document.getElementById('w-en').innerText = "Empty"; return; }
            const w = f[idx % f.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('w-ko').innerText = w.ko;
            document.getElementById('w-ex').innerText = w.ex || "...";
            document.getElementById('prog-info').innerText = `${(idx % f.length) + 1} / ${f.length}`;
            document.getElementById('w-img').classList.remove('revealed');
            document.getElementById('img-reveal').style.display = 'flex';
            document.getElementById('w-ex').classList.remove('revealed');
            document.getElementById('ex-reveal').style.display = 'flex';
            fetchGeminiVisual(w.en);
        }

        function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
        function goNext(e) {
            if (e) e.stopPropagation();
            const ko = document.getElementById('w-ko'); ko.style.opacity = "0";
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { idx++; refresh(); ko.innerText = ""; ko.style.opacity = "1"; }, 400);
        }
        function setFilter(l, b) {
            currentFilter = l;
            document.querySelectorAll('.lv-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active'); idx = 0; refresh();
        }
        function clearAll() { if (confirm('Reset?')) { words = []; localStorage.removeItem('voca_list'); init(); } }
        function nav(n) {
            document.getElementById('learn-view').style.display = n === 'learn' ? 'block' : 'none';
            document.getElementById('manage-view').style.display = n === 'manage' ? 'block' : 'none';
            document.getElementById('table-view').style.display = n === 'table' ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', n === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', n === 'manage');
            document.getElementById('tab-table').classList.toggle('active', n === 'table');
            if (n === 'table') renderTable();
        }
        // ── OCR: 이미지에서 전체 단어 추출 ──
        async function handleOCR(event) {
            const file = event.target.files[0];
            if (!file) return;
            const btn = document.getElementById('btn-ocr');
            btn.disabled = true;
            try {
                btn.innerText = '⏳ OCR 분석 중...';
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                const stopWords = new Set(['the','and','for','are','but','not','you','all','can','was','one','has','how','its','may','new','now','see','two','who','did','she','too','use','this','that','with','from','they','have','been','will','your','more','when','also','into','than','then','them','these']);
                const found = [...new Set(
                    (text.match(/[a-zA-Z]{3,}/g) || []).map(w => w.toLowerCase())
                )].filter(w => !stopWords.has(w));

                if (!found.length) { alert('영단어를 찾지 못했습니다.'); return; }

                const existing = new Set(words.map(w => w.en.toLowerCase()));
                const toAdd = [];
                for (let i = 0; i < found.length; i++) {
                    btn.innerText = `번역 중 (${i + 1}/${found.length})...`;
                    if (existing.has(found[i])) continue;
                    const ko = await translateToKorean(found[i]);
                    if (ko) { toAdd.push({ en: found[i], ko, day: 'User' }); existing.add(found[i]); }
                }

                if (toAdd.length) {
                    words = [...toAdd, ...words];
                    saveAndRef(); refresh();
                    alert(`✅ ${toAdd.length}개 단어 추가 완료! (${found.length - toAdd.length}개 중복 제외)`);
                } else {
                    alert('새로 추가할 단어가 없습니다 (모두 중복).');
                }
            } catch(e) { alert('오류: ' + e.message); }
            finally { btn.innerText = '📸 사진 OCR — 영단어 일괄 추출 & 추가'; btn.disabled = false; event.target.value = ''; }
        }

        // ── 테이블 뷰 ──
        let tblFilter = 'ALL';
        let tblSortCol = 'en';
        let tblSortAsc = true;

        function renderTable() {
            const q = (document.getElementById('tbl-search').value || '').toLowerCase();
            let list = words.filter(w => {
                if (tblFilter !== 'ALL' && String(w.day) !== tblFilter) return false;
                return !q || w.en.toLowerCase().includes(q) || (w.ko || '').includes(q);
            });
            list.sort((a, b) => {
                const av = (a[tblSortCol] || '').toString().toLowerCase();
                const bv = (b[tblSortCol] || '').toString().toLowerCase();
                return tblSortAsc ? av.localeCompare(bv, 'ko') : bv.localeCompare(av, 'ko');
            });
            document.getElementById('tbl-body').innerHTML = list.map((w, i) => `
                <tr>
                    <td style="opacity:0.3; font-size:0.72rem;">${i + 1}</td>
                    <td><b style="color:#91b9ff">${w.en}</b></td>
                    <td>${w.ko || '<span style="opacity:0.3;color:#ef4444">미번역</span>'}</td>
                    <td><span class="tbl-lv-tag">${w.day || '-'}</span></td>
                    <td style="opacity:0.45; font-size:0.75rem; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;" title="${(w.ex || '').replace(/"/g, '&quot;')}">${w.ex || '-'}</td>
                    <td><button class="tbl-del-btn" onclick="deleteWordByEn(this)">✕</button></td>
                </tr>
            `).join('');
            document.getElementById('tbl-info').innerText = `${list.length}개 표시 중 / 전체 ${words.length}개`;
        }

        function setTblFilter(level, btn) {
            tblFilter = level;
            document.querySelectorAll('.tbl-lv-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderTable();
        }

        function sortTable(col) {
            if (tblSortCol === col) tblSortAsc = !tblSortAsc;
            else { tblSortCol = col; tblSortAsc = true; }
            ['en', 'ko', 'day'].forEach(c => {
                const el = document.getElementById('sort-' + c);
                if (el) el.innerText = c === col ? (tblSortAsc ? '▲' : '▼') : '';
            });
            renderTable();
        }

        function deleteWordByEn(btn) {
            const en = btn.closest('tr').querySelector('td:nth-child(2) b').innerText;
            words = words.filter(w => w.en !== en);
            saveAndRef(); renderTable();
        }

        window.onload = init;
    </script>
</body>
