<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | Powered by 날아라메뚜기</title>
    <script src="vocabulary.js" onerror="window.MASTER_WORDS=[]"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #09090b;
            --primary: #4285f4;
            --accent: #10b981;
            --card-bg: rgba(255, 255, 255, 0.03);
            --danger: #ef4444;
            --gemini-grad: linear-gradient(135deg, #4285f4, #91b9ff, #c084fc);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(66, 133, 244, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(192, 132, 252, 0.1) 0%, transparent 50%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
            position: relative;
            min-height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
        }

        .header h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: 800;
            background: var(--gemini-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(66, 133, 244, 0.3));
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            opacity: 0.4;
            font-weight: 700;
            transition: 0.3s;
        }

        .tab.active {
            background: rgba(66, 133, 244, 0.15);
            opacity: 1;
            color: white;
            border-color: rgba(66, 133, 244, 0.5);
            box-shadow: 0 0 20px rgba(66, 133, 244, 0.2);
        }

        .card-container {
            perspective: 2000px;
            width: 100%;
            aspect-ratio: 3/5.8;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.8rem 1.6rem;
            background: rgba(20, 20, 25, 0.8);
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(66, 133, 244, 0.1), rgba(192, 132, 252, 0.05));
            justify-content: center;
        }

        .word-text {
            font-size: clamp(2.2rem, 10vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 1.2rem;
            text-align: center;
            color: #fff;
            letter-spacing: -2px;
        }

        .meaning-text {
            font-size: 3rem;
            font-weight: 800;
            text-align: center;
            color: #fff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }

        .visual-box {
            width: 100%;
            height: 210px;
            border-radius: 28px;
            margin-bottom: 1.2rem;
            background: #000;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .visual-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.6s ease;
            filter: blur(25px);
            opacity: 0.3;
        }

        .visual-box img.revealed {
            filter: blur(0);
            opacity: 1;
        }

        .reveal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
            transition: 0.3s;
        }

        .reveal-overlay span {
            background: rgba(255, 255, 255, 0.15);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(5px);
        }

        .reveal-overlay:hover span {
            background: rgba(66, 133, 244, 0.4);
            transform: scale(1.05);
        }

        .img-loader {
            position: absolute;
            font-size: 0.7rem;
            color: #4285f4;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .explanation-box {
            width: 100%;
            flex-grow: 1;
            padding: 1.2rem;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            min-height: 100px;
            overflow: hidden;
        }

        .ex-text {
            font-size: 1.15rem;
            line-height: 1.5;
            color: #e4e4e7;
            font-weight: 600;
            word-break: keep-all;
            filter: blur(15px);
            transition: 0.4s;
            pointer-events: none;
        }

        .ex-text.revealed {
            filter: blur(0);
            pointer-events: auto;
        }

        .ex-tag {
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--gemini-grad);
            color: #fff;
            font-size: 0.65rem;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        .btn-main {
            background: var(--gemini-grad);
            border: none;
            color: white;
            padding: 1.1rem;
            border-radius: 24px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            font-size: 1.05rem;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 15px 30px -10px rgba(66, 133, 244, 0.5);
        }

        .btn-main:hover {
            transform: translateY(-3px);
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        /* 🎖️ 제작자 브랜딩 푸터 */
        .footer {
            margin-top: auto;
            padding: 2rem 0;
            text-align: center;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.25);
            font-weight: 700;
            letter-spacing: 1.5px;
            transition: 0.4s;
            cursor: default;
        }

        .footer:hover {
            color: #91b9ff;
            transform: scale(1.02);
        }

        .footer .author {
            color: var(--accent);
            opacity: 0.8;
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        .manage-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            padding: 2rem;
        }

        .api-input-wrap {
            background: rgba(66, 133, 244, 0.05);
            border-radius: 22px;
            padding: 1.2rem;
            border: 1px solid rgba(66, 133, 244, 0.2);
            margin-bottom: 2rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.9rem;
            border-radius: 15px;
            background: #000;
            border: 1px solid rgba(66, 133, 244, 0.3);
            color: #91b9ff;
            margin-top: 10px;
            font-family: monospace;
            outline: none;
        }

        select {
            width: 100%;
            padding: 1rem;
            border-radius: 20px;
            background: #1a1a2e;
            border: 1px solid rgba(66, 133, 244, 0.2);
            color: white;
            margin-bottom: 12px;
            font-weight: 700;
            text-align: center;
        }

        .level-selector {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 10px;
            scrollbar-width: none;
        }

        .lv-btn {
            flex-shrink: 0;
            padding: 9px 16px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.85rem;
            color: #fff;
            cursor: pointer;
        }

        .lv-btn.active {
            background: #10b981;
            border-color: #10b981;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>Gemini Visual Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습 중</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">AI 설정</div>
        </div>

        <!-- 학습 뷰 -->
        <div id="learn-view">
            <div class="level-selector">
                <div class="lv-btn active" onclick="setFilter('ALL', this)">전체</div>
                <div class="lv-btn" onclick="setFilter('TRAVEL', this)">여행</div>
                <div class="lv-btn" onclick="setFilter('KID', this)">어린이</div>
                <div class="lv-btn" onclick="setFilter('ELEM', this)">초등</div>
                <div class="lv-btn" onclick="setFilter('MID', this)">중등</div>
                <div class="lv-btn" onclick="setFilter('HIGH', this)">고등</div>
            </div>

            <div
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; padding: 0 10px;">
                <span id="model-info" style="color: #91b9ff; font-weight: 800; font-size: 0.85rem;">Mode: ACTIVE</span>
                <span id="prog-info" style="color: rgba(255,255,255,0.3); font-size: 0.8rem; font-weight: 800;">0 /
                    0</span>
            </div>

            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">Loading...</div>
                        <div class="visual-box">
                            <div class="img-loader" id="img-loader">
                                <div
                                    style="width:20px;height:20px;border:3px solid rgba(66,133,244,0.1);border-top-color:#4285f4;border-radius:50%;animation:spin 0.8s linear infinite;">
                                </div>
                            </div>
                            <img id="w-img" src="" alt="visual">
                            <div class="reveal-overlay" id="img-reveal" onclick="revealElement('img', event)">
                                <span>🖼️ 사진 보기</span>
                            </div>
                        </div>
                        <div class="explanation-box">
                            <span class="ex-tag">✨ Gemini Quiz</span>
                            <div id="w-ex" class="ex-text">...</div>
                            <div class="reveal-overlay" id="ex-reveal" onclick="revealElement('ex', event)">
                                <span>🔍 힌트 보기</span>
                            </div>
                        </div>
                    </div>
                    <div class="card-back">
                        <div id="w-ko" class="meaning-text">...</div>
                        <button class="btn-main" style="margin-top: 2.5rem;" onclick="goNext(event)">다음 마스터 ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 관리 뷰 -->
        <div id="manage-view">
            <div class="manage-card">
                <div class="api-input-wrap">
                    <p style="font-size: 0.85rem; color: #91b9ff; font-weight: 800; text-align: center;">🔑 Gemini API
                        Key</p>
                    <input type="text" id="gemini-key" placeholder="키를 붙여넣으세요" onchange="saveKey()">
                </div>
                <div style="margin-bottom: 1.5rem;">
                    <p
                        style="font-size: 0.75rem; color: rgba(255,255,255,0.3); margin-bottom: 6px; text-align: center;">
                        🤖 AI 모델 선택</p>
                    <select id="sel-model" onchange="updateModelInfo()">
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                    </select>
                </div>
                <p
                    style="font-size: 0.95rem; margin-bottom: 12px; color: #10b981; font-weight: 800; text-align: center;">
                    🚀 AI 영단어 생성</p>
                <select id="sel-level">
                    <option value="TRAVEL">✈️ 필수 여행 어휘</option>
                    <option value="KID">👶 어린이 기초</option>
                    <option value="ELEM">🎒 초등학교 필수</option>
                    <option value="MID">🏫 중학교 핵심</option>
                    <option value="HIGH" selected>🎓 고등학교 수능</option>
                </select>
                <button id="btn-batch" class="btn-main" style="width: 100%;" onclick="askGeminiBatch(100)">AI 100개 세트
                    생성</button>
                <div
                    style="display:flex; justify-content: space-between; margin-top:2.5rem; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 1.5rem;">
                    <span id="list-cnt" style="font-size:0.85rem; color:rgba(255,255,255,0.3);">0개 보유</span>
                    <button
                        style="border:none; background:none; color:var(--danger); font-size:0.8rem; font-weight:800; cursor:pointer;"
                        onclick="clearAll()">리셋</button>
                </div>
            </div>
        </div>

        <!-- 🏅 제작자 날아라메뚜기 브랜딩 -->
        <footer class="footer">
            CREATED BY <span class="author">날아라메뚜기</span>
        </footer>
    </main>

    <script>
        let words = [];
        let currentFilter = 'ALL';
        let idx = 0;

        function init() {
            const saved = localStorage.getItem('voca_list');
            words = saved ? JSON.parse(saved) : (window.MASTER_WORDS || []);
            const key = localStorage.getItem('gemini_api_key');
            if (key) document.getElementById('gemini-key').value = key;
            const mod = localStorage.getItem('gemini_model');
            if (mod) document.getElementById('sel-model').value = mod;
            saveAndRef(); refresh(); updateModelInfo();
        }

        function saveKey() {
            const val = document.getElementById('gemini-key').value.trim();
            if (val) localStorage.setItem('gemini_api_key', val);
        }

        function updateModelInfo() {
            const name = document.getElementById('sel-model').value;
            localStorage.setItem('gemini_model', name);
            const el = document.getElementById('model-info');
            if (el) el.innerText = `Mode: ${name.toUpperCase().replace('GEMINI-', '')}`;
        }

        function saveAndRef() {
            const uniq = []; const seen = new Set();
            words.forEach(w => {
                if (!w.en) return;
                const k = w.en.toLowerCase().trim();
                if (!seen.has(k)) { seen.add(k); uniq.push(w); }
            });
            words = uniq;
            localStorage.setItem('voca_list', JSON.stringify(words));
            const cntEl = document.getElementById('list-cnt');
            if (cntEl) cntEl.innerText = `${words.length}개 보유 중`;
        }

        async function askGeminiBatch(count) {
            const key = localStorage.getItem('gemini_api_key');
            if (!key) { alert('API 키를 입력하세요!'); return; }
            const modelName = document.getElementById('sel-model').value;
            const level = document.getElementById('sel-level').value;
            const btn = document.getElementById('btn-batch');
            btn.innerText = "⏳ 생성 중..."; btn.disabled = true;
            try {
                let context = level === 'TRAVEL' ? "여행 단어" : level;
                const prompt = `${context} 영어 단어 ${count}개. 중복 불가. 힌트(ex) 포함. JSON 배열만: [{"en":"단어", "ko":"뜻", "ex":"수수께끼"}, ...]`;
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const data = await res.json();
                const list = JSON.parse(data.candidates[0].content.parts[0].text);
                words = [...list.map(i => ({ ...i, day: level })), ...words];
                saveAndRef(); refresh(); alert('성공!');
            } catch (e) { alert('오출: ' + e.message); }
            finally { btn.innerText = "AI 100개 세트 생성"; btn.disabled = false; }
        }

        async function fetchGeminiVisual(word) {
            const img = document.getElementById('w-img');
            const loader = document.getElementById('img-loader');
            const key = localStorage.getItem('gemini_api_key');
            const modelName = document.getElementById('sel-model').value;
            img.classList.remove('revealed'); loader.style.display = 'flex';
            let p = word;
            if (key) {
                try {
                    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${key}`, {
                        method: 'POST',
                        body: JSON.stringify({ contents: [{ parts: [{ text: `3 keywords for ${word}` }] }] })
                    });
                    const d = await r.json(); p = d.candidates[0].content.parts[0].text.trim();
                } catch (e) { }
            }
            img.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(p + ' cinematic')}?width=500&height=350&nologo=true&seed=${Math.floor(Math.random() * 999)}`;
            img.onload = () => { loader.style.display = 'none'; };
        }

        function revealElement(type, e) {
            if (e) e.stopPropagation();
            if (type === 'img') {
                document.getElementById('w-img').classList.add('revealed');
                document.getElementById('img-reveal').style.display = 'none';
            } else {
                document.getElementById('w-ex').classList.add('revealed');
                document.getElementById('ex-reveal').style.display = 'none';
            }
        }

        function refresh() {
            const f = (currentFilter === 'ALL') ? words : words.filter(w => w.day === currentFilter);
            if (!f.length) { document.getElementById('w-en').innerText = "Empty"; return; }
            const w = f[idx % f.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('w-ko').innerText = w.ko;
            document.getElementById('w-ex').innerText = w.ex || "...";
            document.getElementById('prog-info').innerText = `${(idx % f.length) + 1} / ${f.length}`;
            document.getElementById('w-img').classList.remove('revealed');
            document.getElementById('img-reveal').style.display = 'flex';
            document.getElementById('w-ex').classList.remove('revealed');
            document.getElementById('ex-reveal').style.display = 'flex';
            fetchGeminiVisual(w.en);
        }

        function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
        function goNext(e) {
            if (e) e.stopPropagation();
            const ko = document.getElementById('w-ko'); ko.style.opacity = "0";
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { idx++; refresh(); ko.innerText = ""; ko.style.opacity = "1"; }, 400);
        }
        function setFilter(l, b) {
            currentFilter = l;
            document.querySelectorAll('.lv-btn').forEach(btn => btn.classList.remove('active'));
            b.classList.add('active'); idx = 0; refresh();
        }
        function clearAll() { if (confirm('Reset?')) { words = []; localStorage.removeItem('voca_list'); init(); } }
        function nav(n) {
            document.getElementById('learn-view').style.display = n === 'learn' ? 'block' : 'none';
            document.getElementById('manage-view').style.display = n === 'manage' ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', n === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', n === 'manage');
        }
        window.onload = init;
    </script>
</body>

</html>
