<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 단어 일러스트 학습</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d0d12;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0d0d12 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            opacity: 0.6;
        }

        .tab.active {
            background: var(--primary);
            opacity: 1;
            color: white;
            border-color: var(--primary);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4.8;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.2rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
        }

        .word-text {
            font-size: clamp(2rem, 8vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #fff;
            text-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
        }

        .meaning-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 5px;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        #w-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-reload {
            margin-top: 10px;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: var(--accent);
            font-size: 0.7rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reload:hover {
            background: rgba(34, 211, 238, 0.1);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .stats-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 0.8rem;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .stat-val {
            font-size: 1.3rem;
            font-weight: 800;
            color: var(--accent);
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 1.1rem;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            margin-top: 5px;
            margin-bottom: 0.8rem;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">내 단어장</div>
        </div>

        <div id="learn-view">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding: 0 5px;">
                <span id="day-info" style="color: var(--accent); font-weight: 800; font-size: 0.8rem;">Day 01</span>
                <span id="prog-info" style="opacity: 0.5; font-size: 0.8rem;">1 / 20</span>
            </div>

            <div class="card-container" id="card" onclick="document.getElementById('card').classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">...</div>
                        <div class="image-box">
                            <div class="loader-wrap" id="w-loader">
                                <div class="spinner"></div>
                                <div style="font-size:0.7rem; color:var(--accent);">AI 작화 중...</div>
                            </div>
                            <img id="w-img">
                        </div>
                        <button class="btn-reload" onclick="forceReload(event)">🎨 다른 그림으로 보기</button>
                        <p style="margin-top: 1rem; opacity: 0.4; font-size: 0.65rem;">터치하면 뜻이 나타납니다</p>
                    </div>
                    <div class="card-back">
                        <div id="w-ko" class="meaning-text">...</div>
                        <button class="btn-main" style="margin-top: 2.5rem;" onclick="goNext(event)">다음 단어 학습하기
                            ➔</button>
                    </div>
                </div>
            </div>

            <div class="stats-area">
                <div class="stat-card">
                    <div style="font-size:0.7rem; opacity:0.5;">오늘 공부</div>
                    <div id="cnt-day" class="stat-val">0</div>
                </div>
                <div class="stat-card">
                    <div style="font-size:0.7rem; opacity:0.5;">누적 공부</div>
                    <div id="cnt-all" class="stat-val">0</div>
                </div>
            </div>
        </div>

        <div id="manage-view">
            <div class="card-front" style="position:static; height: auto;">
                <button class="btn-main" style="margin-bottom: 1.5rem;" onclick="addAI()">✨ 고등 필수 AI 단어 추천</button>
                <input type="text" id="in-en" placeholder="영어 단어 (예: Universe)" onblur="autoKo()">
                <input type="text" id="in-ko" placeholder="한글 뜻">
                <button class="btn-main" onclick="addManual()">저장하기</button>
                <div id="list-box" style="width: 100%; margin-top: 1.5rem; max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>
    </main>

    <script>
        const MASTER = [
            { en: 'include', ko: '포함하다', day: 1 }, { en: 'produce', ko: '생산하다', day: 1 }, { en: 'belief', ko: '믿음', day: 1 }, { en: 'similar', ko: '유사한', day: 1 }, { en: 'moment', ko: '순간', day: 1 },
            { en: 'population', ko: '인구', day: 11 }, { en: 'foster', ko: '조성하다', day: 11 }, { en: 'nurture', ko: '양육하다', day: 11 },
            { en: 'modern', ko: '현대의', day: 12 }, { en: 'contemporary', ko: '동시대의', day: 12 },
            { en: 'applause', ko: '박수', day: 13 }, { en: 'glance', ko: '흘끗 봄', day: 13 },
            { en: 'occupation', ko: '직업', day: 14 }, { en: 'supervise', ko: '감독하다', day: 14 }
        ];

        let words = JSON.parse(localStorage.getItem('voca_list')) || MASTER;
        let idx = Math.floor(Math.random() * words.length);
        let dCnt = parseInt(localStorage.getItem('voca_daily') || '0');
        let tCnt = parseInt(localStorage.getItem('voca_total') || '0');

        function nav(name) {
            document.getElementById('learn-view').style.display = (name === 'learn') ? 'block' : 'none';
            document.getElementById('manage-view').style.display = (name === 'manage') ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', name === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', name === 'manage');
            if (name === 'manage') drawList();
        }

        function drawPic(word, force = false) {
            const img = document.getElementById('w-img');
            const loader = document.getElementById('w-loader');
            img.style.display = 'none';
            loader.style.display = 'flex';

            const clean = word.replace(/[^a-zA-Z]/g, "").trim();
            const seed = force ? Math.random() : 1234567; // 랜덤값 부여로 중복 방지

            // 핵심: 고해상도 사진 대신 '단어 의미 집중 일러스트' 프롬프트
            const prompt = `Very simple 3D clay style illustration of ${clean}, cute character, minimal clean background, soft lighting`;
            const source = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&nologo=true&seed=${Math.floor(seed * 100000)}`;

            img.src = source;
            img.onload = () => { img.style.display = 'block'; loader.style.display = 'none'; };
            img.onerror = () => {
                // 고양이 대신 단어 의미를 검색한 실사 삽화 소스로 교체
                img.src = `https://loremflickr.com/512/512/drawing,${clean}?lock=${Math.floor(seed * 1000)}`;
                img.onload = () => { img.style.display = 'block'; loader.style.display = 'none'; };
            };
        }

        function forceReload(e) {
            if (e) e.stopPropagation();
            drawPic(words[idx % words.length].en, true);
        }

        function refresh() {
            if (!words.length) return;
            const w = words[idx % words.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('w-ko').innerText = w.ko;
            document.getElementById('day-info').innerText = `Day ${String(w.day || 'AI').padStart(2, '0')}`;
            document.getElementById('prog-info').innerText = `${(idx % words.length) + 1} / ${words.length}`;
            drawPic(w.en);
            document.getElementById('cnt-day').innerText = dCnt;
            document.getElementById('cnt-all').innerText = tCnt;
        }

        function goNext(e) {
            if (e) e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                idx = Math.floor(Math.random() * words.length);
                dCnt++; tCnt++;
                localStorage.setItem('voca_daily', dCnt);
                localStorage.setItem('voca_total', tCnt);
                refresh();
            }, 300);
        }

        async function autoKo() {
            const en = document.getElementById('in-en').value;
            if (!en) return;
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|ko`);
                const d = await r.json();
                document.getElementById('in-ko').value = d.responseData.translatedText;
            } catch (e) { }
        }

        function addManual() {
            const en = document.getElementById('in-en').value;
            const ko = document.getElementById('in-ko').value;
            if (en && ko) {
                words.unshift({ en, ko, day: 'User' });
                localStorage.setItem('voca_list', JSON.stringify(words));
                document.getElementById('in-en').value = '';
                document.getElementById('in-ko').value = '';
                drawList(); alert('저장 완료!');
            }
        }

        function drawList() {
            const b = document.getElementById('list-box');
            b.innerHTML = words.slice(0, 50).map((w, i) => `
                <div style="padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <span><b>${w.en}</b> : ${w.ko}</span>
                    <span style="color: #ff4d4d; font-weight: 800; cursor: pointer;" onclick="del(${i})">삭제</span>
                </div>
            `).join('');
        }

        function del(i) {
            words.splice(i, 1);
            localStorage.setItem('voca_list', JSON.stringify(words));
            drawList();
        }

        async function addAI() {
            const list = ["phenomenon", "fundamental", "perspective", "hypothesis", "significance"];
            const en = list[Math.floor(Math.random() * list.length)];
            try {
                const r = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|ko`);
                const d = await r.json();
                words.unshift({ en, ko: d.responseData.translatedText, day: 'AI' });
                localStorage.setItem('voca_list', JSON.stringify(words));
                drawList(); alert('AI 추천 단어 추가!');
            } catch (e) { }
        }

        if (localStorage.getItem('voca_date') !== new Date().toDateString()) {
            dCnt = 0; localStorage.setItem('voca_daily', '0');
            localStorage.setItem('voca_date', new Date().toDateString());
        }

        window.onload = refresh;
    </script>
</body>

</html>
