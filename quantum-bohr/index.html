<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 한영 단어 공부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --background: #0a0a0c;
            --foreground: #ffffff;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0c 100%);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header {
            margin-bottom: 0.8rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #6366f1, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        #study-section,
        #calendar-section,
        #manage-section {
            display: none;
        }

        #study-section.active,
        #calendar-section.active,
        #manage-section.active {
            display: block;
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4.5;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card-front {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
        }

        .word-text {
            font-size: clamp(2rem, 8vw, 2.5rem);
            font-weight: 800;
            margin-bottom: 1rem;
            color: var(--accent);
        }

        .meaning-text {
            font-size: 2.5rem;
            font-weight: 700;
            text-align: center;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 5px;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #word-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        .image-loading-spinner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-ai-auto {
            background: linear-gradient(135deg, #FF3D77, #FF7F50);
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 0.5rem;
        }

        .stat-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 1rem;
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.5;
            margin-bottom: 0.3rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .input-group {
            text-align: left;
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            margin-top: 5px;
            font-size: 1rem;
        }
    </style>
</head>

<body>
    <div id="loading-overlay" style="display:none;" class="loading-overlay">
        <div class="image-loading-spinner"></div>
    </div>

    <main>
        <div class="header">
            <h1>AI Word Master</h1>
        </div>
        <div class="nav-tabs">
            <div id="tab-study" class="tab active" onclick="showSection('study')">학습</div>
            <div id="tab-calendar" class="tab" onclick="showSection('calendar')">기록</div>
            <div id="tab-manage" class="tab" onclick="showSection('manage')">관리</div>
        </div>

        <!-- STUDY -->
        <div id="study-section" class="active">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.8rem; align-items: center;">
                <span id="day-badge"
                    style="background: var(--primary); padding: 4px 12px; border-radius: 15px; font-size: 0.8rem; font-weight: 700;">Day
                    01</span>
                <span id="progress-text" style="opacity: 0.5; font-size: 0.8rem;">1 / 0</span>
            </div>

            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card-inner" id="card-inner">
                    <div class="card-front">
                        <div id="word-en" class="word-text">Loading...</div>
                        <div class="image-box">
                            <div class="image-loading-spinner" id="img-spinner"></div>
                            <img id="word-img" src="">
                        </div>
                        <p style="margin-top: 15px; opacity: 0.4; font-size: 0.7rem;">터치하여 정답 확인</p>
                    </div>
                    <div class="card-back">
                        <div id="word-ko" class="meaning-text">...</div>
                        <button class="btn-primary" style="margin-top: 2.5rem;" onclick="nextWord(event)">다음 단어로
                            ➔</button>
                    </div>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-label">오늘의 학습</div>
                    <div id="daily-count" class="stat-value">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">전체 누적</div>
                    <div id="total-count" class="stat-value">0</div>
                </div>
            </div>
        </div>

        <!-- MANAGE -->
        <div id="manage-section">
            <div class="glass-card">
                <button class="btn-ai-auto" onclick="recommendAIWord()">✨ 고등 필수 AI 단어 추천</button>
                <div style="text-align: left; margin-top: 1.5rem;">
                    <p class="stat-label">직접 단어 추가</p>
                    <input type="text" id="new-en" placeholder="영어 단어" onblur="autoTranslate()">
                    <input type="text" id="new-ko" placeholder="한글 뜻">
                    <button class="btn-primary" style="margin-top: 10px;" onclick="manualAdd()">단어장에 저장</button>
                </div>
                <div id="word-list" style="margin-top: 2rem; max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>
    </main>

    <script>
        const MASTER_WORDS = [
            { en: 'include', ko: '포함하다', day: 1 }, { en: 'produce', ko: '생산하다', day: 1 }, { en: 'belief', ko: '믿음', day: 1 }, { en: 'similar', ko: '유사한', day: 1 }, { en: 'moment', ko: '순간', day: 1 },
            { en: 'situation', ko: '상황', day: 1 }, { en: 'improve', ko: '개선하다', day: 1 }, { en: 'increase', ko: '증가하다', day: 1 }, { en: 'decrease', ko: '감소하다', day: 1 }, { en: 'share', ko: '공유하다', day: 1 },
            { en: 'population', ko: '인구', day: 11 }, { en: 'foster', ko: '조성하다', day: 11 }, { en: 'nurture', ko: '양육하다', day: 11 }, { en: 'available', ko: '이용 가능한', day: 11 },
            { en: 'modern', ko: '현대의', day: 12 }, { en: 'contemporary', ko: '동시대의', day: 12 }, { en: 'urgent', ko: '긴급한', day: 12 },
            { en: 'applause', ko: '박수', day: 13 }, { en: 'glance', ko: '흘끗 봄', day: 13 }
            // ... (모든 단어 데이터 유지)
        ];

        let words = JSON.parse(localStorage.getItem('voca_list')) || MASTER_WORDS;
        let currentIndex = Math.floor(Math.random() * words.length);
        let dailyCount = parseInt(localStorage.getItem('voca_daily') || '0');
        let totalCount = parseInt(localStorage.getItem('voca_total') || '0');

        function showSection(name) {
            ['study', 'manage'].forEach(s => {
                document.getElementById(`${s}-section`).classList.toggle('active', s === name);
                document.getElementById(`tab-${s}`).classList.toggle('active', s === name);
            });
            if (name === 'manage') renderList();
        }

        function flipCard() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function loadIllustration(keyword) {
            const img = document.getElementById('word-img');
            const spinner = document.getElementById('img-spinner');
            spinner.style.display = 'block';
            img.style.display = 'none';

            // 장애가 없는 초고속 실제 사진 API 활용
            const clean = keyword.replace(/[^a-zA-Z]/g, "").trim();
            const seed = Math.floor(Math.random() * 1000);

            // 이미지 주소를 2단계로 시도
            const primarySource = `https://loremflickr.com/400/400/${clean}?lock=${seed}`;
            const secondarySource = `https://ui-avatars.com/api/?name=${keyword[0]}&size=400&background=random&color=fff&font-size=0.5`;

            img.src = primarySource;

            img.onload = () => {
                img.style.display = 'block';
                spinner.style.display = 'none';
            };

            img.onerror = () => {
                img.src = secondarySource;
                img.style.display = 'block';
                spinner.style.display = 'none';
            };

            // 3초 이상 응답 없으면 강제 그래픽 전환
            setTimeout(() => {
                if (img.style.display === 'none') {
                    img.src = secondarySource;
                    img.style.display = 'block';
                    spinner.style.display = 'none';
                }
            }, 3000);
        }

        function updateUI() {
            if (!words.length) return;
            const word = words[currentIndex % words.length];
            document.getElementById('word-en').innerText = word.en;
            document.getElementById('word-ko').innerText = word.ko;
            document.getElementById('day-badge').innerText = `Day ${String(word.day || 'AI').padStart(2, '0')}`;
            document.getElementById('progress-text').innerText = `${(currentIndex % words.length) + 1} / ${words.length}`;

            loadIllustration(word.en);

            document.getElementById('daily-count').innerText = dailyCount;
            document.getElementById('total-count').innerText = totalCount;
        }

        function nextWord(e) {
            if (e) e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                currentIndex = Math.floor(Math.random() * words.length);
                dailyCount++; totalCount++;
                localStorage.setItem('voca_daily', dailyCount);
                localStorage.setItem('voca_total', totalCount);
                updateUI();
            }, 300);
        }

        async function autoTranslate() {
            const en = document.getElementById('new-en').value;
            if (!en) return;
            try {
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(en)}&langpair=en|ko`);
                const data = await res.json();
                document.getElementById('new-ko').value = data.responseData.translatedText;
            } catch (e) { }
        }

        function manualAdd() {
            const en = document.getElementById('new-en').value;
            const ko = document.getElementById('new-ko').value;
            if (en && ko) {
                words.unshift({ en, ko, day: 'User' });
                localStorage.setItem('voca_list', JSON.stringify(words));
                alert('단어가 추가되었습니다!');
                document.getElementById('new-en').value = '';
                document.getElementById('new-ko').value = '';
                renderList();
            }
        }

        function renderList() {
            const list = document.getElementById('word-list');
            list.innerHTML = words.slice(0, 50).map((w, i) => `
                <div style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between;">
                    <span><b>${w.en}</b>: ${w.ko}</span>
                    <span style="color:red; cursor:pointer;" onclick="deleteWord(${i})">삭제</span>
                </div>
            `).join('');
        }

        function deleteWord(i) {
            words.splice(i, 1);
            localStorage.setItem('voca_list', JSON.stringify(words));
            renderList();
        }

        // 초기 실행
        updateUI();
    </script>
</body>

</html>
