<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | AI 족집게 설명 모드</title>
    <script src="vocabulary.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d0d12;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0d0d12 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            opacity: 0.6;
        }

        .tab.active {
            background: var(--primary);
            opacity: 1;
            color: white;
            border-color: var(--primary);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4.8;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
        }

        .word-text {
            font-size: clamp(2.2rem, 9vw, 2.8rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.5);
        }

        .meaning-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        /* 📝 설명 박스 UI (사진 대신 등장) */
        .explanation-box {
            width: 100%;
            min-height: 180px;
            padding: 1.2rem;
            border-radius: 22px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ex-text {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #ced4da;
            text-align: center;
            font-style: italic;
        }

        .ex-tag {
            position: absolute;
            top: -10px;
            left: 15px;
            background: var(--accent);
            color: #000;
            font-size: 0.65rem;
            padding: 3px 8px;
            border-radius: 8px;
            font-weight: 800;
        }

        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 1rem;
            border-radius: 15px;
            background: #1a1a2e;
            border: 1px solid var(--primary);
            color: white;
            margin-bottom: 10px;
            font-size: 1rem;
        }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">관리</div>
        </div>

        <!-- LEARN VIEW -->
        <div id="learn-view">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding: 0 5px;">
                <span id="day-info" style="color: var(--accent); font-weight: 800; font-size: 0.8rem;">Ready</span>
                <span id="prog-info" style="opacity: 0.5; font-size: 0.8rem;">0 / 0</span>
            </div>

            <div class="card-container" id="card" onclick="document.getElementById('card').classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">...</div>
                        <div class="explanation-box">
                            <span class="ex-tag">AI 족집게 설명</span>
                            <div class="loader-wrap" id="ex-loader">
                                <div class="spinner"></div>
                                <div style="font-size:0.7rem; color:var(--accent); margin-top:10px;">설명 가져오는 중...</div>
                            </div>
                            <div id="w-ex" class="ex-text" style="display:none"></div>
                        </div>
                        <p style="margin-top: 1.5rem; opacity: 0.4; font-size: 0.7rem;">터치하면 뜻이 보입니다</p>
                    </div>
                    <div class="card-back">
                        <div id="w-ko" class="meaning-text">...</div>
                        <button class="btn-main" style="margin-top: 3rem;" onclick="goNext(event)">다음 단어 학습하기 ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MANAGE VIEW -->
        <div id="manage-view">
            <div class="card-front" style="position:static; height: auto;">
                <div
                    style="width: 100%; margin-bottom: 1.5rem; background: rgba(99, 102, 241, 0.1); padding: 1.2rem; border-radius: 20px; border: 1px solid var(--primary);">
                    <p style="font-size: 0.85rem; margin-bottom: 15px; color: var(--accent); font-weight: 800;">🤖 AI 대량
                        단어 & 설명 생성</p>
                    <select id="sel-level">
                        <option value="어린이">👶 어린이용</option>
                        <option value="초등학교">🎒 초등학생 필용</option>
                        <option value="중학교">🏫 중학생 내신 필수</option>
                        <option value="고등학교">🎓 고등학생/수능 고난도</option>
                    </select>
                    <button id="btn-batch" class="btn-main" onclick="askAIBatch()">✨ AI 단어 100개 설명까지 생성</button>
                    <button class="btn-main"
                        style="margin-top:10px; background: rgba(255,255,255,0.05); font-size:0.9rem;"
                        onclick="exportToFile()">💾 텍스트 파일로 저장</button>
                </div>
                <div id="list-box" style="width: 100%; max-height: 250px; overflow-y: auto;"></div>
            </div>
        </div>
    </main>

    <script>
        if (typeof MASTER_WORDS === 'undefined') {
            var MASTER_WORDS = [{ en: 'phenomenon', ko: '현상', day: 'HIGH' }];
        }

        let words = JSON.parse(localStorage.getItem('voca_list')) || MASTER_WORDS;
        let idx = Math.floor(Math.random() * words.length);

        function nav(name) {
            document.getElementById('learn-view').style.display = (name === 'learn') ? 'block' : 'none';
            document.getElementById('manage-view').style.display = (name === 'manage') ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', name === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', name === 'manage');
            if (name === 'manage') drawList();
        }

        async function fetchExplanation(wordEn) {
            const exEl = document.getElementById('w-ex');
            const loader = document.getElementById('ex-loader');
            exEl.style.display = 'none';
            loader.style.display = 'flex';

            // 캐시된 설명이 있는지 확인
            const currentWord = words[idx % words.length];
            if (currentWord.ex) {
                showEx(currentWord.ex);
                return;
            }

            try {
                const prompt = `Explain the English word "${wordEn}" in one simple sentence in Korean for students, and provide one short English example sentence with Korean translation. Format: "설명 내용. 예시: English sentence (해석)." Keep it under 60 characters.`;
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const explanation = await response.text();

                // 단어장에 설명 저장 (캐싱)
                currentWord.ex = explanation;
                localStorage.setItem('voca_list', JSON.stringify(words));
                showEx(explanation);
            } catch (e) {
                showEx("AI가 잠시 쉬는 중입니다. 단어의 뜻을 생각해보세요!");
            }
        }

        function showEx(text) {
            const exEl = document.getElementById('w-ex');
            const loader = document.getElementById('ex-loader');
            exEl.innerText = text;
            exEl.style.display = 'block';
            loader.style.display = 'none';
        }

        async function askAIBatch() {
            const btn = document.getElementById('btn-batch');
            const level = document.getElementById('sel-level').value;
            btn.innerText = "⏳ AI가 100개 집필 중...";
            btn.disabled = true;

            try {
                // 단어, 뜻, 설명을 한 번에 JSON으로 요청
                const prompt = `Please generate 100 English words for ${level} level. 
                Format strictly as JSON array: [{"en":"word", "ko":"뜻", "ex":"간단설명 & 예문"}, ...]`;

                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const textOutput = await response.text();
                const jsonStr = textOutput.replace(/```json|```/g, "").trim();
                const newWords = JSON.parse(jsonStr);

                if (Array.isArray(newWords)) {
                    words = [...newWords, ...words];
                    localStorage.setItem('voca_list', JSON.stringify(words));
                    drawList();
                    alert(`✅ 완료! ${newWords.length}개의 단어와 AI 설명이 추가되었습니다.`);
                    refresh();
                }
            } catch (e) {
                alert("AI 서버 연결이 원활하지 않습니다. 잠시 후 시도해 주세요!");
            } finally {
                btn.innerText = "✨ AI 단어 100개 설명까지 생성";
                btn.disabled = false;
            }
        }

        function exportToFile() {
            let content = "AI Word Master Vocabulary List\n" + "=".repeat(30) + "\n\n";
            words.forEach(w => content += `${w.en} : ${w.ko}\n[AI설명] ${w.ex || '없음'}\n\n`);
            const blob = new Blob([content], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `my_voca_ai.txt`;
            a.click();
        }

        function refresh() {
            if (!words.length) return;
            const w = words[idx % words.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('w-ko').innerText = w.ko;
            document.getElementById('day-info').innerText = `${w.day || 'AI'} Level`;
            document.getElementById('prog-info').innerText = `${(idx % words.length) + 1} / ${words.length}`;
            fetchExplanation(w.en);
        }

        function goNext(e) {
            if (e) e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                idx = Math.floor(Math.random() * words.length);
                refresh();
            }, 300);
        }

        function drawList() {
            const b = document.getElementById('list-box');
            b.innerHTML = words.slice(0, 50).map((w, i) => `
                <div style="padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 0.85rem;">
                    <b>${w.en}</b> : ${w.ko}
                </div>
            `).join('');
        }

        window.onload = refresh;
    </script>
</body>

</html>
