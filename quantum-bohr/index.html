<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 수수께끼 퀴즈 모드</title>
    <script src="vocabulary.js" onerror="window.MASTER_WORDS=[]"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #0d0d12;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1e1e30 0%, #0d0d12 100%);
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header h1 {
            font-size: 1.8rem;
            text-align: center;
            margin-bottom: 0.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            transition: 0.3s;
            opacity: 0.6;
            font-weight: 700;
        }

        .tab.active {
            background: var(--primary);
            opacity: 1;
            color: white;
            border-color: var(--primary);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4.8;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(168, 85, 247, 0.15));
        }

        .word-text {
            font-size: clamp(2rem, 8vw, 2.6rem);
            font-weight: 800;
            margin-bottom: 1.5rem;
            color: #fff;
            text-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
        }

        .meaning-text {
            font-size: 2.8rem;
            font-weight: 700;
            color: #fff;
            text-align: center;
        }

        .explanation-box {
            width: 100%;
            min-height: 200px;
            padding: 1.5rem;
            border-radius: 24px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.08);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .ex-text {
            font-size: 1rem;
            line-height: 1.7;
            color: #f8f9fa;
            font-weight: 500;
            word-break: keep-all;
        }

        .ex-tag {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #FFD93D;
            color: #000;
            font-size: 0.7rem;
            padding: 4px 12px;
            border-radius: 10px;
            font-weight: 800;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }

        .btn-main {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 20px;
            font-weight: 800;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
            font-size: 1.1rem;
        }

        .btn-main:active {
            transform: scale(0.96);
        }

        .btn-main:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        #manage-view {
            display: none;
            width: 100%;
        }

        select {
            width: 100%;
            padding: 1rem;
            border-radius: 15px;
            background: #1a1a2e;
            border: 1px solid var(--primary);
            color: white;
            margin-bottom: 10px;
            font-size: 1rem;
            font-weight: 700;
        }

        .loading-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <main>
        <div class="header">
            <h1>AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-learn" class="tab active" onclick="nav('learn')">학습</div>
            <div id="tab-manage" class="tab" onclick="nav('manage')">관리</div>
        </div>

        <!-- LEARN VIEW -->
        <div id="learn-view">
            <div style="display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding: 0 5px;">
                <span id="day-info" style="color: var(--accent); font-weight: 800; font-size: 0.8rem;">Quiz Mode</span>
                <span id="prog-info" style="opacity: 0.5; font-size: 0.8rem;">0 / 0</span>
            </div>

            <div class="card-container" id="card" onclick="document.getElementById('card').classList.toggle('flipped')">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="w-en" class="word-text">...</div>
                        <div class="explanation-box">
                            <span class="ex-tag">🔎 정답 유추 힌트</span>
                            <div class="loading-wrap" id="ex-loader">
                                <div class="spinner"></div>
                                <div style="font-size:0.75rem; color:var(--accent); margin-top:10px;">AI 수수께끼 생성 중...
                                </div>
                            </div>
                            <div id="w-ex" class="ex-text" style="display:none"></div>
                        </div>
                        <p style="margin-top: 1.5rem; opacity: 0.4; font-size: 0.7rem; font-weight: 600;">카드를 터치하면 정답이
                            공개됩니다</p>
                    </div>
                    <div class="card-back">
                        <div id="w-ko" class="meaning-text">...</div>
                        <button class="btn-main" style="margin-top: 3.2rem;" onclick="goNext(event)">다음 문제 ➔</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- MANAGE VIEW -->
        <div id="manage-view">
            <div class="card-front" style="position:static; height: auto;">
                <div
                    style="width: 100%; margin-bottom: 1.5rem; background: rgba(99, 102, 241, 0.15); padding: 1.3rem; border-radius: 25px; border: 2px solid var(--primary);">
                    <p style="font-size: 0.9rem; margin-bottom: 15px; color: var(--accent); font-weight: 800;">🤖 AI
                        수수께끼 단어장 생성기</p>
                    <select id="sel-level">
                        <option value="preschool children basic">👶 어린이 기초 한글/영어</option>
                        <option value="elementary school essential">🎒 초등 필수 기초</option>
                        <option value="middle school curriculum">🏫 중학생 내신 필수</option>
                        <option value="high school academic">🎓 고등학생/수능 고난도</option>
                    </select>
                    <button id="btn-batch" class="btn-main" onclick="askAIBatch()">✨ AI 단어 50개 즉시 추가</button>
                    <button class="btn-main"
                        style="margin-top:10px; background: rgba(255,255,255,0.05); font-size:0.9rem;"
                        onclick="exportToFile()">💾 텍스트 파일로 백업</button>
                </div>
                <div id="list-box" style="width: 100%; max-height: 300px; overflow-y: auto; padding-right: 5px;"></div>
            </div>
        </div>
    </main>

    <script>
        let words = [];
        const FALLBACK = [{ en: 'phenomenon', ko: '현상', day: 'HIGH', ex: '자연이나 기상에서 일상적으로 일어나지 않는 특별한 일을 말해요. 예문: This is a rare ____.' }];

        function init() {
            const saved = localStorage.getItem('voca_list');
            if (saved) {
                try { words = JSON.parse(saved); } catch (e) { words = FALLBACK; }
            } else if (typeof MASTER_WORDS !== 'undefined' && MASTER_WORDS.length > 0) {
                words = MASTER_WORDS;
            } else {
                words = FALLBACK;
            }
            if (!words.length) words = FALLBACK;
            localStorage.setItem('voca_list', JSON.stringify(words));
        }

        init();
        let idx = Math.floor(Math.random() * words.length);

        function nav(name) {
            document.getElementById('learn-view').style.display = (name === 'learn') ? 'block' : 'none';
            document.getElementById('manage-view').style.display = (name === 'manage') ? 'block' : 'none';
            document.getElementById('tab-learn').classList.toggle('active', name === 'learn');
            document.getElementById('tab-manage').classList.toggle('active', name === 'manage');
            if (name === 'manage') drawList();
        }

        async function fetchEx(wordEn) {
            const current = words[idx % words.length];
            const exEl = document.getElementById('w-ex');
            const loader = document.getElementById('ex-loader');
            exEl.style.display = 'none';
            loader.style.display = 'flex';

            // 저장된 설명이 있으면 바로 사용 (초고속)
            if (current.ex && !current.ex.includes(wordEn)) {
                showEx(current.ex);
                return;
            }

            try {
                // 수수께끼 모드 프롬프트: 단어 이름과 한글 뜻 절대 금지
                const prompt = `Describe purely the context or meaning of "${wordEn}" in Korean WITHOUT using the word "${wordEn}" itself or its direct Korean translation. Make it like a riddle. Also provide one English example sentence where "${wordEn}" is replaced by "____". Keep it total under 80 chars. No greeting.`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                let text = await res.text();

                // 혹시 모를 스포일러 방역
                text = text.replace(new RegExp(wordEn, 'gi'), "____");

                current.ex = text;
                localStorage.setItem('voca_list', JSON.stringify(words));
                showEx(text);
            } catch (e) {
                showEx("AI가 고뇌 중입니다. 정답을 맞춰보세요!");
            }
        }

        function showEx(text) {
            document.getElementById('w-ex').innerText = text;
            document.getElementById('w-ex').style.display = 'block';
            document.getElementById('ex-loader').style.display = 'none';
        }

        function refresh() {
            if (!words.length) return;
            const w = words[idx % words.length];
            document.getElementById('w-en').innerText = w.en;
            document.getElementById('w-ko').innerText = w.ko;
            document.getElementById('day-info').innerText = `${w.day || 'AI'} Level`;
            document.getElementById('prog-info').innerText = `${(idx % words.length) + 1} / ${words.length}`;
            fetchEx(w.en);
        }

        function goNext(e) {
            if (e) e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => {
                idx = Math.floor(Math.random() * words.length);
                refresh();
            }, 300);
        }

        async function askAIBatch() {
            const btn = document.getElementById('btn-batch');
            btn.innerText = "⏳ 50개 데이터 수집 중... (약 10초)";
            btn.disabled = true;
            try {
                const level = document.getElementById('sel-level').value;
                const prompt = `Give me 50 English words for ${level}. Respond ONLY with a clean JSON array of strings: ["word1", "word2", ...]. No markdown, no extra text.`;
                const res = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                const out = await res.text();
                const list = JSON.parse(out.replace(/```json|```/g, "").trim());

                if (Array.isArray(list)) {
                    // 번역은 개별 학습 시 AI가 처리하므로, 일단 단어만 빠르게 추가
                    const newEntries = list.map(en => ({ en, ko: '정답 보기 클릭', day: level.split(" ")[0].toUpperCase() }));
                    words = [...newEntries, ...words];
                    localStorage.setItem('voca_list', JSON.stringify(words));
                    drawList(); alert('50개 추가 완료! 학습을 시작하세요.');
                    refresh();
                }
            } catch (e) {
                alert('AI 서버 지연! 한 번 더 시도해 주세요.');
            } finally {
                btn.innerText = "✨ AI 단어 50개 즉시 추가";
                btn.disabled = false;
            }
        }

        function drawList() {
            const b = document.getElementById('list-box');
            if (!b) return;
            b.innerHTML = words.slice(0, 50).map(w => `<div style="padding:10px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.85rem;"><b>${w.en}</b></div>`).join('');
        }

        function exportToFile() {
            let txt = words.map(w => `${w.en} : ${w.ko}\n`).join('\n');
            const blob = new Blob([txt], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'voca_backup.txt';
            a.click();
        }

        window.onload = refresh;
    </script>
</body>

</html>
