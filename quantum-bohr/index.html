<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Word Master | 한영 단어 공부</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
    <!-- Tesseract.js for OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --background: #0a0a0c;
            --foreground: #ffffff;
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #22d3ee;
            --card-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }

        body {
            background: var(--background);
            background-image: radial-gradient(circle at 50% 0%, #1a1a2e 0%, #0a0a0c 100%);
            color: var(--foreground);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem;
        }

        main {
            width: 100%;
            max-width: 450px;
        }

        .header {
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .header h1 {
            font-size: 1.8rem;
            background: linear-gradient(to right, #6366f1, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 2rem;
            justify-content: center;
            width: 100%;
        }

        .tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            border-radius: 25px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: rgba(255, 255, 255, 0.6);
        }

        .tab.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        #study-section,
        #calendar-section,
        #manage-section {
            display: none;
        }

        #study-section.active,
        #calendar-section.active,
        #manage-section.active {
            display: block;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            opacity: 0.6;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent);
        }

        .card-container {
            perspective: 1000px;
            width: 100%;
            aspect-ratio: 3/4;
            cursor: pointer;
            margin-bottom: 1.5rem;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front,
        .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .card-front {
            background: rgba(255, 255, 255, 0.03);
        }

        .card-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
        }

        .word-text {
            font-size: clamp(2.5rem, 8vw, 3.5rem);
            font-weight: 800;
            margin-bottom: 1rem;
        }

        .meaning-text {
            font-size: 3rem;
            font-weight: 700;
            color: #fff;
        }

        .image-box {
            width: 100%;
            aspect-ratio: 1;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 1rem;
            background: #1a1a1e;
        }

        .image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            color: white;
            padding: 1.2rem;
            border-radius: 16px;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        .btn-ocr {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed var(--accent);
            color: var(--accent);
            padding: 1rem;
            border-radius: 12px;
            width: 100%;
            margin-bottom: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-weight: 600;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: white;
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
        }

        .calendar-day {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .calendar-day.completed {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: white;
            border: none;
            font-weight: 800;
        }

        .completion-overlay,
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(15px);
            z-index: 1000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        /* Loading Spinner */
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="completion-overlay" class="completion-overlay">
        <h2 style="font-size: 4rem;">🏆</h2>
        <h2 style="margin: 1rem 0;">오늘 학습 끝!</h2>
        <button class="btn-primary" onclick="closeOverlay()">닫기</button>
    </div>

    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">이미지 분석 중...</p>
    </div>

    <main>
        <div class="header">
            <h1 onclick="location.reload()" style="cursor:pointer">AI Word Master</h1>
        </div>

        <div class="nav-tabs">
            <div id="tab-study" class="tab active" onclick="showSection('study')">학습</div>
            <div id="tab-calendar" class="tab" onclick="showSection('calendar')">기록</div>
            <div id="tab-manage" class="tab" onclick="showSection('manage')">단어 관리</div>
        </div>

        <!-- STUDY -->
        <div id="study-section" class="active">
            <div class="stats-grid">
                <div class="glass-card">
                    <div class="stat-label">오늘</div>
                    <div id="daily-count" class="stat-value">0</div>
                </div>
                <div class="glass-card">
                    <div class="stat-label">누적</div>
                    <div id="total-count" class="stat-value">0</div>
                </div>
            </div>
            <div class="card-container" id="card">
                <div class="card-inner">
                    <div class="card-front">
                        <div id="word-en" class="word-text">...</div>
                        <div class="image-box"><img id="word-img" src="" alt=""></div>
                    </div>
                    <div class="card-back">
                        <div id="word-ko" class="meaning-text">...</div>
                        <button class="btn-primary" style="margin-top: 2rem;" onclick="nextWord(event)">다음</button>
                    </div>
                </div>
            </div>
            <p id="progress-text" style="text-align: center; opacity: 0.5; font-size: 0.9rem;">0 / 0</p>
        </div>

        <!-- CALENDAR -->
        <div id="calendar-section">
            <div class="glass-card">
                <h3 id="calendar-month" style="margin-bottom: 1.5rem;"></h3>
                <div class="calendar-grid" id="calendar-days"></div>
            </div>
        </div>

        <!-- MANAGE -->
        <div id="manage-section">
            <div class="glass-card">
                <h3 style="margin-bottom: 1.5rem; text-align: left;">새 단어 등록</h3>

                <!-- OCR Button -->
                <button class="btn-ocr" onclick="document.getElementById('ocr-input').click()">
                    <span>📸 사진에서 영어 단어 추출</span>
                </button>
                <input type="file" id="ocr-input" accept="image/*" style="display:none" onchange="handleOCR(event)">

                <div class="input-group">
                    <label class="stat-label">영어 단어</label>
                    <input type="text" id="new-en" placeholder="예: Galaxy">
                </div>
                <div class="input-group">
                    <label class="stat-label">한글 뜻</label>
                    <input type="text" id="new-ko" placeholder="예: 은하수">
                </div>
                <div class="input-group">
                    <label class="stat-label">이미지 힌트 (영어)</label>
                    <input type="text" id="new-prompt" placeholder="영어 입력 시 더 정확한 AI 이미지가 나옵니다">
                </div>
                <button class="btn-primary" onclick="addWord()">단어장에 추가하기</button>

                <div style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1rem;">
                    <p class="stat-label">내 단어장 목록</p>
                    <div id="word-list"
                        style="text-align: left; max-height: 200px; overflow-y: auto; margin-top: 1rem; font-size: 0.9rem;">
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const DEFAULT_WORDS = [
            { en: 'Success', ko: '성공', prompt: 'reaching the mountain top' },
            { en: 'Adventure', ko: '모험', prompt: 'exploring a wild jungle' }
        ];

        let words = JSON.parse(localStorage.getItem('voca_list')) || DEFAULT_WORDS;
        let currentIndex = 0;
        let studyHistory = JSON.parse(localStorage.getItem('voca_history') || '{}');
        let dailyCount = parseInt(localStorage.getItem('voca_daily') || '0');
        let totalCount = parseInt(localStorage.getItem('voca_total') || '0');
        let todayCompleted = false;

        const dateKey = new Date().toISOString().split('T')[0];

        function showSection(section) {
            ['study', 'calendar', 'manage'].forEach(s => {
                document.getElementById(`${s}-section`).classList.toggle('active', s === section);
                document.getElementById(`tab-${s}`).classList.toggle('active', s === section);
            });
            if (section === 'calendar') renderCalendar();
            if (section === 'manage') renderWordList();
        }

        // OCR Implementation
        async function handleOCR(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById('loading-overlay').style.display = 'flex';
            document.getElementById('loading-text').innerText = '영어를 분석하는 중...';

            try {
                const { data: { text } } = await Tesseract.recognize(file, 'eng');
                // Extract only English alphabets and ignore others, take the first long word or sentence
                const words_found = text.match(/[a-zA-Z]+/g);
                if (words_found && words_found.length > 0) {
                    // Filter out very short words
                    const candidate = words_found.find(w => w.length > 2) || words_found[0];
                    document.getElementById('new-en').value = candidate;
                    document.getElementById('new-prompt').value = candidate;
                    alert('영어 단어가 추출되었습니다! 뜻을 입력해주세요.');
                } else {
                    alert('영어 단어를 찾지 못했습니다. 다시 시도해 주세요.');
                }
            } catch (err) {
                console.error(err);
                alert('분석 중 오류가 발생했습니다.');
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
                event.target.value = ''; // Reset input
            }
        }

        function addWord() {
            const en = document.getElementById('new-en').value.trim();
            const ko = document.getElementById('new-ko').value.trim();
            const prompt = document.getElementById('new-prompt').value.trim() || en;

            if (!en || !ko) return alert('단어와 뜻을 입력해주세요!');
            words.push({ en, ko, prompt });
            localStorage.setItem('voca_list', JSON.stringify(words));
            renderWordList();
            document.getElementById('new-en').value = '';
            document.getElementById('new-ko').value = '';
            document.getElementById('new-prompt').value = '';
        }

        function renderWordList() {
            const list = document.getElementById('word-list');
            list.innerHTML = words.map((w, i) => `
                <div style="display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05)">
                    <span><b>${w.en}</b>: ${w.ko}</span>
                    <span style="color: #ff5555; cursor: pointer;" onclick="deleteWord(${i})">삭제</span>
                </div>
            `).join('');
        }

        function deleteWord(i) {
            words.splice(i, 1);
            localStorage.setItem('voca_list', JSON.stringify(words));
            renderWordList();
        }

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            document.getElementById('calendar-month').innerText = `${year}년 ${month + 1}월`;
            const grid = document.getElementById('calendar-days');
            grid.innerHTML = '';
            ['일', '월', '화', '수', '목', '금', '토'].forEach(d => {
                const el = document.createElement('div'); el.innerText = d; el.style.opacity = '0.4'; el.style.fontSize = '0.7rem'; grid.appendChild(el);
            });
            const firstDay = new Date(year, month, 1).getDay();
            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));
            const daysCount = new Date(year, month + 1, 0).getDate();
            for (let i = 1; i <= daysCount; i++) {
                const dKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                const dayEl = document.createElement('div');
                dayEl.className = 'calendar-day' + (studyHistory[dKey] ? ' completed' : '');
                dayEl.innerText = i;
                grid.appendChild(dayEl);
            }
        }

        function updateUI() {
            if (words.length === 0) {
                document.getElementById('word-en').innerText = '단어 없음';
                return;
            }
            const word = words[currentIndex % words.length];
            document.getElementById('word-en').innerText = word.en;
            document.getElementById('word-ko').innerText = word.ko;
            document.getElementById('word-img').src = `https://pollinations.ai/p/${encodeURIComponent(word.prompt)}?width=400&height=400&nologo=true`;
            document.getElementById('daily-count').innerText = dailyCount;
            document.getElementById('total-count').innerText = totalCount;
            document.getElementById('progress-text').innerText = `${(currentIndex % words.length) + 1} / ${words.length}`;

            if ((currentIndex % words.length) === words.length - 1 && !todayCompleted && words.length > 0) {
                todayCompleted = true;
                studyHistory[dateKey] = true;
                localStorage.setItem('voca_history', JSON.stringify(studyHistory));
                setTimeout(() => { document.getElementById('completion-overlay').style.display = 'flex'; }, 800);
            }
        }

        function nextWord(e) {
            e.stopPropagation();
            document.getElementById('card').classList.remove('flipped');
            setTimeout(() => { currentIndex++; dailyCount++; totalCount++; updateLocalStorage(); updateUI(); }, 300);
        }

        function updateLocalStorage() {
            localStorage.setItem('voca_daily', dailyCount);
            localStorage.setItem('voca_total', totalCount);
        }

        function closeOverlay() { document.getElementById('completion-overlay').style.display = 'none'; }
        document.getElementById('card').addEventListener('click', () => { if (words.length) document.getElementById('card').classList.toggle('flipped'); });

        // Reset daily at midnight
        if (localStorage.getItem('voca_date') !== new Date().toDateString()) {
            dailyCount = 0;
            localStorage.setItem('voca_daily', '0');
            localStorage.setItem('voca_date', new Date().toDateString());
        }

        updateUI();
    </script>
</body>

</html>
